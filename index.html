<title>Le Sakura</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600&display=swap">
<style>
/* Layout : coque d'application — navigation latérale sur PC, barre d'onglets en bas sur téléphone ; contenu en cartes de travail lisibles (police Atkinson Hyperlegible, pensée pour la basse vision) */
:root{
  --bg:#fbf6f1; --surface:#ffffff; --surface-2:#f5eaea; --line:#ead9da; --fg:#2c1824; --muted:#715a67;
  --accent:#8b3d62; --accent-fg:#ffffff; --accent-soft:#f7e0e9;
  --ok:#1b7443; --ok-soft:#d9f0e1; --warn:#8c5300; --warn-soft:#fbead0; --bad:#ae2a20; --bad-soft:#f8dedb;
  --info:#2a5592; --info-soft:#dde7f6; --night:#4b3f8f; --night-soft:#e6e2f6;
  --scrim:rgba(12,24,26,.5); --shadow:0 12px 32px rgba(12,24,26,.18);
  --font-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Lexend","Atkinson Hyperlegible",system-ui,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191115; --surface:#231920; --surface-2:#2e2229; --line:#45333c; --fg:#f5e9ee; --muted:#bfa8b4;
    --accent:#f0a6c1; --accent-fg:#2b0f1d; --accent-soft:#4b2537;
    --ok:#6dd197; --ok-soft:#163623; --warn:#efb25a; --warn-soft:#3a2a10; --bad:#f2968d; --bad-soft:#41201d;
    --info:#94b6ef; --info-soft:#1b2c47; --night:#b9aef5; --night-soft:#2a2550;
    --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191115; --surface:#231920; --surface-2:#2e2229; --line:#45333c; --fg:#f5e9ee; --muted:#bfa8b4;
  --accent:#f0a6c1; --accent-fg:#2b0f1d; --accent-soft:#4b2537;
  --ok:#6dd197; --ok-soft:#163623; --warn:#efb25a; --warn-soft:#3a2a10; --bad:#f2968d; --bad-soft:#41201d;
  --info:#94b6ef; --info-soft:#1b2c47; --night:#b9aef5; --night-soft:#2a2550;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* Coque */
.app{min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding-block:20px;padding-right:12px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 18px}
.brand svg{flex:none}
.brand strong{font-family:var(--font-display);font-size:19px;font-weight:600;display:block;line-height:1.1}
.brand span{font-size:13px;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:8px 12px;border:0;border-radius:10px;background:none;text-align:left;cursor:pointer;font-size:15px}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav-btn .badge{margin-left:auto}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--bad);color:var(--surface);font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.side-foot{margin-top:auto;padding:16px 8px 0;display:grid;gap:10px;font-size:13px;color:var(--muted)}
main{padding-block:24px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;max-width:1320px;width:100%;margin-inline:auto;display:block}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px 20px;margin-bottom:22px}
.topbar h1{font-size:28px}
.topbar .sub{color:var(--muted);margin-top:2px}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.me select{min-height:40px;width:auto}
/* Barre de navigation en haut */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding-block:6px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.nav-brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:17px;white-space:nowrap}
.nav-brand .brand-mark{width:40px;height:40px;border-radius:10px}
.tabbar{flex-wrap:wrap;row-gap:4px}
.sessbar{flex-basis:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 0 6px;border-bottom:1px solid var(--line);font-size:14px}
.sess-who{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.sessbar .btn{min-height:32px}
@media (max-width:600px){.sessbar{flex-wrap:nowrap}.sessbar .muted{display:none}.sessbar .btn{padding:0 8px}}
.tab.out{color:var(--bad);font-weight:700}
.tab.out:hover{background:var(--bad-soft)}
.cinfo-row.ro{cursor:default}
.cinfo-row.ro:hover{background:none}
.pill.solid{color:#fff}
.pill.solid.info{background:var(--info)} .pill.solid.acc{background:var(--accent);color:var(--accent-fg)} .pill.solid.warn{background:var(--warn)} .pill.solid.bad{background:var(--bad)} .pill.solid.ok{background:var(--ok)} .pill.solid.night{background:var(--night)}
:root[data-theme="dark"] .pill.solid{color:var(--bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.solid{color:var(--bg)}}
.post{border-width:1.5px;border-top-width:6px}
.post-info{background:var(--info-soft);border-color:var(--info)} .post-acc{background:var(--accent-soft);border-color:var(--accent)} .post-warn{background:var(--warn-soft);border-color:var(--warn)}
.post-bad{background:var(--bad-soft);border-color:var(--bad)} .post-ok{background:var(--ok-soft);border-color:var(--ok)} .post-night{background:var(--night-soft);border-color:var(--night)}
.mc-table{font-size:13px;min-width:max-content}
.mc-table th,.mc-table td{padding:4px 3px;border-bottom:1px solid var(--line)}
.mc-table th.dayh{min-width:36px;text-align:center;font-size:12px;color:var(--fg)}
.mc-table th.mc-name{position:sticky;left:0;z-index:2;background:var(--surface);min-width:150px;white-space:normal;padding:6px 8px;text-align:left;font-size:13px}
.mc-table thead th:first-child{position:sticky;left:0;z-index:3;background:var(--surface)}
.mc-table tr.me-row th.mc-name{background:var(--accent-soft)}
.mc-td{text-align:center}
.mc-table .we{background:color-mix(in srgb,var(--info) 16%,var(--surface))}
.mc-table th.we{color:var(--info);border-bottom:3px solid var(--info)}
.mc-table .fe{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.mc-table th.fe{color:var(--accent);border-bottom:3px solid var(--accent)}
.mc-table th .fe-l{display:block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.cal-key{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.cal-key span{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.cal-key i{width:16px;height:16px;border-radius:4px;display:inline-block}
.mc-table .today{box-shadow:inset 0 0 0 2px var(--accent)}
.cellbtn{width:34px;height:32px;border-radius:7px;border:1px solid var(--line);font:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:0}
.cellbtn.sh-{background:var(--surface);color:var(--muted)}
.cellbtn:disabled{cursor:not-allowed;opacity:.85}
.cellro{display:inline-grid;place-items:center;width:32px;height:28px;border-radius:7px;font-weight:700}
.covn{display:inline-grid;place-items:center;min-width:24px;height:22px;border-radius:6px;font-weight:700;font-size:12px}
.covn.ok{background:var(--ok-soft);color:var(--ok)} .covn.bad{background:var(--bad-soft);color:var(--bad)}
.mcard{cursor:pointer}
.mcard:hover{box-shadow:0 0 0 1.5px var(--line)}
.mcard.sel{box-shadow:0 0 0 2.5px var(--accent);background:var(--accent-soft)}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pickshift{display:grid;gap:2px;padding:12px;border-radius:12px;border:1.5px solid var(--line);cursor:pointer;text-align:left;font:inherit;min-height:62px;background:var(--surface);color:var(--fg)}
.pickshift.cur{box-shadow:0 0 0 2.5px var(--accent)}
.chgbox{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-color:var(--accent)}
.tabs{flex:1;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;max-width:1200px;margin-inline:auto}
.tab-wrap{position:relative;display:flex;min-width:0}
.tab-wrap>.tab{flex:1}
.subpop{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:30;display:grid;gap:2px}
.subitem{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:6px 10px;border:0;background:none;border-radius:8px;text-align:left;cursor:pointer;font:inherit;font-size:14px;color:var(--fg)}
.subitem:hover{background:var(--surface-2)}
.subitem[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.subitem .badge{margin-left:auto;position:static}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.subtab{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font:inherit;font-size:14px;font-weight:600;color:var(--fg)}
.subtab:hover{border-color:var(--accent)}
.subtab[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.subtab .badge{min-width:18px;height:18px;font-size:11px}
.nav-btn .chev{margin-left:auto;color:var(--muted);font-size:13px}
.nav-btn.grp .badge{margin-left:auto}
.nav-btn.grp .badge+.chev{margin-left:8px}
.dsub{display:grid;gap:2px;margin:0 0 6px 22px;padding-left:12px;border-left:2px solid var(--line)}
.nav-btn.sub{min-height:40px;font-size:14px}
.hub{margin:-4px 0 20px}
.hub-h{font-size:16px;margin-bottom:10px;color:var(--muted)}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.hub-tile{position:relative;display:flex;align-items:center;gap:12px;min-height:74px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:var(--fg)}
.hub-tile:hover{border-color:var(--accent);background:var(--accent-soft)}
.hub-tile svg{color:var(--accent);flex:none}
.hub-tile .ht{display:grid;gap:2px;min-width:0}
.hub-tile small{color:var(--muted);font-size:13px}
.hub-tile .badge{position:absolute;top:8px;right:8px}
.hub-tile.dis{opacity:.55;cursor:not-allowed}
.hub-tile.dis:hover{border-color:var(--line);background:var(--surface)}
.backlink{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px 0 6px;margin-bottom:10px;border:0;background:none;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;border-radius:10px}
.backlink:hover{background:var(--accent-soft)}
.tr-tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:8px;margin-bottom:16px}
.tr-tab{position:relative;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font:inherit;font-weight:700;font-size:14px;color:var(--fg);text-align:left}
.tr-tab svg{color:var(--accent);flex:none}
.tr-tab:hover{border-color:var(--accent)}
.tr-tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tr-tab.on svg{color:var(--accent-fg)}
.tr-tab .badge{position:absolute;top:-6px;right:-6px}
.tr.todo{border-left:5px solid var(--warn)}
.tr-obj{font-size:17px;margin:6px 0 4px}
.ret-blk{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.ret-blk h3{font-size:14px;color:var(--accent);margin:0 0 6px}
.not-adm .cinfo-row .ed{display:none}
.not-adm .cinfo-row{cursor:default}
.bell{position:relative;font-size:16px}
.bell .badge{position:absolute;top:-7px;right:-7px}
.rap-card{margin-bottom:16px;border-color:var(--warn)}
.rap-list{display:grid;gap:6px}
.rap{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:48px;padding:8px 12px;border:1px solid var(--line);border-left:5px solid var(--info);border-radius:10px;background:var(--surface);font:inherit;font-weight:600;color:var(--fg);cursor:pointer}
.rap>span{flex:1}
.rap.warn{border-left-color:var(--warn)}
.rap.bad{border-left-color:var(--bad)}
.rap:hover{background:var(--surface-2)}
.rap svg:first-child{color:var(--accent);flex:none}
.print-bar{display:flex;justify-content:flex-end;margin:-6px 0 10px}
.j-table td{vertical-align:top}
.pr-h{display:flex;align-items:center;gap:12px;border-bottom:2px solid #8a4776;padding-bottom:8px;margin-bottom:12px}
.pr-h img{width:48px;height:48px;border-radius:50%}
.pr-h h1{font-size:20px;margin:0;color:#5a2d45}
.pr-h p{margin:0;font-size:12px;color:#666}
@media print{
 body.printing #print-root{font-size:12px;color:#000}
 body.printing #print-root button:not(.cellbtn):not(.actc):not(.agev),body.printing #print-root .toolbar,body.printing #print-root .top-actions,body.printing #print-root .print-bar,body.printing #print-root .backlink,body.printing #print-root .hub{display:none!important}
 body.printing #print-root *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body.printing #print-root table{border-collapse:collapse;width:100%}
 body.printing #print-root th,body.printing #print-root td{border:1px solid #ccc}
 body.printing #print-root .table-wrap{overflow:visible}
 body.printing #print-root .aweek{grid-template-columns:repeat(7,1fr)}
 body.printing #print-root .card,body.printing #print-root .actc,body.printing #print-root .menu-d{break-inside:avoid}
 @page{margin:10mm}
}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.n-table th,.n-table td{text-align:center;padding:4px}
.n-table th.mc-name{text-align:left}
.n-table td.n-off{background:repeating-linear-gradient(45deg,var(--surface-2) 0 6px,transparent 6px 12px)}
.nc{position:relative;width:44px;height:44px;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface);font:inherit;font-size:22px;font-weight:800;cursor:pointer;color:var(--muted)}
.nc.ok{background:var(--ok-soft);border:1.5px solid var(--ok)}
.nc.info{background:var(--info-soft);border:1.5px solid var(--info)}
.nc.warn{background:var(--warn-soft);border:1.5px solid var(--warn)}
.nc.bad{background:var(--bad-soft);border:1.5px solid var(--bad)}
.nc.late{border:2px solid var(--bad);color:var(--bad);background:var(--bad-soft)}
.nc-s{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:13px;font-style:normal;line-height:18px}
.pp-orow{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.pp-obj{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;display:grid;gap:4px}
.pp-ob{margin:0;padding-left:10px;border-left:3px solid var(--accent-soft)}
.menu-week{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.menu-d{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:8px;align-content:start}
.menu-d[role=button]{cursor:pointer}
.menu-d[role=button]:hover{border-color:var(--accent)}
.menu-d.is-today{box-shadow:inset 0 0 0 2px var(--accent)}
.menu-d h3{font-size:16px;margin:0}
.menu-r{display:grid;gap:4px}
.menu-l{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
.menu-p{display:flex;align-items:center;gap:10px}
.menu-p small{display:block;color:var(--muted);font-size:11px}
.menu-e{font-size:30px;line-height:1;flex:none;width:36px;text-align:center}
.menu-today{margin-bottom:16px}
.menu-today .menu-r{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));align-items:center;margin-bottom:6px}
.menu-today .menu-l{grid-column:1/-1}
.alert-card{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.cst-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 8px;flex-wrap:wrap}
.cst-top>div{display:grid}
.cst-big{font-size:28px;font-weight:800;font-family:var(--font-display)}
.spark{max-width:100%}
.cst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.cst-grid span{display:grid;background:var(--surface-2);border-radius:8px;padding:6px 8px}
.cst-grid small{color:var(--muted);font-size:12px}
.cst-grid strong{font-size:15px}
.rep-table td{vertical-align:middle;min-width:110px}
.repc{display:grid;justify-items:center;gap:2px;width:100%;min-height:62px;padding:6px;border:1.5px dashed var(--line);border-radius:10px;background:var(--surface);font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--fg)}
.repc.bad{background:var(--bad-soft);border:1.5px solid var(--bad);color:var(--bad)}
.repc.warn{background:var(--warn-soft);border:1.5px solid var(--warn);color:var(--warn)}
.repc.info{background:var(--info-soft);border:1.5px solid var(--info);color:var(--info)}
.repc.ok{background:var(--ok-soft);border:1.5px solid var(--ok);color:var(--ok)}
.repc-e{font-size:24px;line-height:1}
.eau{display:flex;align-items:center;gap:6px;justify-content:center}
.eau-n{font-weight:800;font-size:16px;min-width:48px;text-align:center}
.eau-n.low{color:var(--warn)}
.repq{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.repq-b{display:grid;justify-items:center;gap:4px;min-height:96px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font:inherit;font-size:16px;font-weight:800;cursor:pointer;color:var(--fg)}
.repq-b span{font-size:38px;line-height:1}
.repq-b.on,.repq-b:hover{border-color:var(--accent);background:var(--accent-soft)}
.dlu{background:#fff;color:#1d1418;border:1px solid #d9cfd4;border-radius:12px;padding:16px}
.dlu-h{display:flex;align-items:center;gap:12px;border-bottom:3px solid #c0392b;padding-bottom:10px;margin-bottom:10px}
.dlu-h img{width:56px;height:56px;border-radius:50%}
.dlu-h h2{font-size:20px;margin:0;color:#c0392b}
.dlu-h p{margin:0;font-size:13px;color:#555}
.dlu-t{width:100%;border-collapse:collapse;font-size:14px}
.dlu-t th{text-align:left;width:34%;vertical-align:top;padding:6px 8px;background:#f6eff2;color:#5a2d45;border:1px solid #e3d7dd;white-space:normal;letter-spacing:0}
.dlu-t td{padding:6px 8px;border:1px solid #e3d7dd;vertical-align:top}
.dlu-f{font-size:12px;color:#666;margin-top:8px}
/* Horaires : postes de travail en pastel bien distincts, absences en couleurs vives */
html .sh-M{background:#cfe2ff;color:#123f85;box-shadow:inset 0 0 0 1px #9fc2f5}
html .sh-J{background:#ffd3e6;color:#8f1d4f;box-shadow:inset 0 0 0 1px #f5a8c9}
html .sh-S{background:#ffe7a1;color:#6b4d00;box-shadow:inset 0 0 0 1px #f0cf6b}
html .sh-N{background:#ddd0ff;color:#3f2296;box-shadow:inset 0 0 0 1px #b9a3f5}
html .sh-I{background:#c6f1d6;color:#145c33;box-shadow:inset 0 0 0 1px #8fdcae}
html .sh-L{background:#ffd5bf;color:#8a330a;box-shadow:inset 0 0 0 1px #f5ad86}
html .sh-F{background:#c9eef3;color:#0a5e69;box-shadow:inset 0 0 0 1.5px #0a8a99}
html .sh-R{background:#1e8e3e;color:#fff;box-shadow:inset 0 0 0 2px #126b2c;font-weight:800}
html .sh-C{background:#e8590c;color:#fff;box-shadow:inset 0 0 0 2px #b8460a;font-weight:800}
html .sh-A,html .sh-AM,html .sh-MA{background:#c2255c;color:#fff;font-weight:800}
html .mc-table .fe{background:color-mix(in srgb,#e03131 30%,var(--surface))}
html .mc-table th.fe{color:#c92a2a;border-bottom:3px solid #e03131;background:color-mix(in srgb,#e03131 22%,var(--surface))}
html .mc-table th .fe-l{color:#c92a2a}
.idea-autre{border-style:dashed;border-color:var(--accent)}
#print-root{display:none}
@media print{
 body.printing>*:not(#print-root){display:none!important}
 body.printing #print-root{display:block}
 body.printing{background:#fff}
 .dlu{border:0;padding:0}
}
.cal.agx .cell{min-height:132px;cursor:zoom-in;gap:4px}
.cal.agx .dn-l{display:none}
.agev{display:grid;gap:1px;width:100%;text-align:left;border:0;border-left:5px solid var(--accent);background:var(--surface-2);border-radius:6px;padding:4px 6px;font:inherit;font-size:12px;color:var(--fg);cursor:pointer;min-width:0}
.agev:hover{filter:brightness(.97)}
.agev strong{font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.agev-t{font-weight:700;color:var(--muted);font-size:11.5px}
.agev-w{color:var(--muted);font-size:11.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.agday{display:grid;gap:12px}
.agbig{border:1px solid var(--line);border-left:8px solid var(--accent);border-radius:12px;padding:12px 14px;background:var(--surface)}
.agbig h3{font-size:20px;margin:6px 0 8px}
.agbig-t{font-size:18px;font-weight:800}
@media (max-width:760px){
 .cal.agx .cal-h{display:none}
 .cal.agx .cal-g{grid-template-columns:1fr}
 .cal.agx .cell{min-height:0;border-left:0;padding:10px 12px}
 .cal.agx .cell.out,.cal.agx .cell.empty{display:none}
 .cal.agx .dn-l{display:inline;text-transform:capitalize}
 .cal.agx .agev,.cal.agx .chip{display:grid}
 .cal.agx .dots{display:none}
}
.aweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:start}
.aday{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:0}
.aday.we{background:color-mix(in srgb,var(--info) 8%,var(--surface))}
.aday.is-today{box-shadow:inset 0 0 0 2px var(--accent)}
.aday-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px;border:0;background:var(--surface-2);border-radius:8px;padding:6px 8px;font:inherit;font-weight:700;cursor:zoom-in;color:var(--fg);text-transform:capitalize}
.aday-h strong{font-size:20px}
.aday-h:hover{background:var(--accent-soft)}
.actc{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;border-left:6px solid var(--pc);background:color-mix(in srgb,var(--pc) 12%,var(--surface));border-radius:10px;padding:8px;font:inherit;color:var(--fg);cursor:pointer;min-width:0}
.actc:hover{background:color-mix(in srgb,var(--pc) 20%,var(--surface))}
.actc-p{font-size:34px;line-height:1;flex:none}
.aweek .actc{flex-direction:column;gap:4px;padding:7px}
.aweek .actc-p{font-size:30px}
@media (max-width:900px){.aweek .actc{flex-direction:row}}
.actc.full .actc-p{font-size:44px}
.actc-b{display:grid;gap:2px;min-width:0}
.actc-b strong{font-size:14px;line-height:1.2}
.actc-t{font-size:12px;font-weight:800;color:var(--pc)}
.actc-l{font-size:12px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.actc-l:empty{display:none}
.tl{position:relative;margin:8px 0 0 52px;border-left:1px solid var(--line)}
.tl-h{position:absolute;left:-52px;right:0;border-top:1px dashed var(--line)}
.tl-h span{position:absolute;left:0;top:-9px;width:44px;text-align:right;font-size:12px;font-weight:700;color:var(--muted)}
.tl-area{position:absolute;inset:0 0 0 6px}
.tl-b{position:absolute;padding:2px 4px 2px 0;display:flex}
.tl-b .actc{height:100%;overflow:auto}
.aprops{display:grid;gap:10px}
.aprop{display:grid;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ideas{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.idea{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:4px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font:inherit;font-weight:600;cursor:pointer;color:var(--fg)}
.idea span{font-size:22px}
.idea:hover{border-color:var(--accent);background:var(--accent-soft)}
.pcats{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.pcat{min-height:38px;padding:0 12px;border-radius:999px;border:2px solid var(--pc);background:var(--surface);color:var(--fg);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.pcat.on{background:var(--pc);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:10px}
.pic{display:grid;justify-items:center;gap:4px;padding:8px 4px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:center}
.pic-e{font-size:40px;line-height:1}
.pic-l{font-size:12px;font-weight:600;line-height:1.2}
.pic:hover{border-color:var(--accent)}
.pic:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
@media (max-width:900px){.aweek{grid-template-columns:1fr}.aday-h{cursor:pointer}}
.tab{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:4px 8px;border:0;background:none;border-radius:10px;font-size:14.5px;cursor:pointer;color:var(--muted);position:relative;min-width:0}
.tab svg{flex:none}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tab .l-short{display:none}
.tab:hover{background:var(--surface-2)}
.tab[aria-current="page"]{color:var(--accent);font-weight:700;background:var(--accent-soft)}
.tab .badge{position:absolute;top:2px;right:calc(50% - 24px);min-width:18px;height:18px;font-size:11px;padding:0 5px}
.tab{flex-direction:column;gap:2px;font-size:12px;min-height:54px;padding:4px 2px}
@media (max-width:1150px){
  .tabbar{position:static}
  .tabs{grid-template-columns:repeat(5,minmax(0,1fr))}
}

/* Menu latéral sur téléphone */
.mbar{display:none}
.dscrim{position:fixed;inset:0;background:var(--scrim);z-index:44}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,330px);background:var(--surface);z-index:45;transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility .22s;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.drawer.open{transform:none;visibility:visible}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 12px;border-bottom:1px solid var(--line)}
.dhead>div{flex:1;min-width:0;display:grid}
.dhead strong{font-family:var(--font-display);font-size:18px;font-weight:600}
.dhead span{font-size:13px;color:var(--muted)}
.dlist{flex:1;overflow:auto;padding:8px;display:grid;gap:2px;align-content:start}
.dfoot{padding:8px;border-top:1px solid var(--line)}
.nav-btn.out{color:var(--bad);font-weight:700}
body.noscroll{overflow:hidden}
body.locked .mbar{display:none!important}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
@media (max-width:860px){
  .tabbar{display:none!important}
  .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .mbtn{position:relative;width:46px;height:46px;border:0;background:none;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
  .mbtn:hover{background:var(--surface-2)}
  .mbtn .badge{position:absolute;top:2px;right:0;min-width:18px;height:18px;font-size:11px;padding:0 5px}
  .mtitle{flex:1;min-width:0;font-family:var(--font-display);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}

/* Accueil */
.posts{max-width:780px;display:grid;gap:14px}
.welcome{display:flex;gap:16px;align-items:center;background:var(--accent-soft);border-color:transparent}
.welcome img{width:64px;height:64px;border-radius:14px;flex:none;background:#fbf4e9}
.welcome h2{font-size:19px}
.post-t{font-size:19px;margin:8px 0 6px}

/* Médicaments : cases à cocher */
.medlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px;align-items:start}
.msub{font-family:var(--font-ui);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 4px}
.mline{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,62px);gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.mline-h{border-top:0;padding:0 0 2px}
.mline-h span{font-size:12px;color:var(--muted);text-align:center;font-weight:700}
.mline .nm,.sbrow .nm{min-width:0}
.mc{width:100%;min-height:46px;border-radius:10px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;font-size:11px;font-weight:700;cursor:pointer;border:0;background:none;color:var(--muted);font-variant-numeric:tabular-nums}
.mc.todo::before{content:"";width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;background:var(--surface)}
.mc.todo:hover{background:var(--surface-2)}
.mc.done{background:var(--ok-soft);color:var(--ok)}
.mc.no{background:var(--bad-soft);color:var(--bad)}
.mc.none{cursor:default;color:var(--line);font-size:18px}
.mc.wide{width:auto;flex-direction:row;gap:8px;padding:0 12px;font-size:13px}
.mc.todo.wide{border:1.5px dashed var(--line);color:var(--fg)}
.mc.todo.wide::before{width:20px;height:20px}
.mc.mini{width:26px;min-height:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;cursor:default}
.mc.mini.todo::before{width:16px;height:16px}
.legend-box{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.mnote{font-size:13px;color:var(--bad);margin:0 0 6px}
.sbrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.sb-do{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media (max-width:600px){
  .mline{grid-template-columns:minmax(0,1fr) repeat(4,46px);gap:3px}
  .mline-h span{font-size:10.5px}
}

/* Contention : tableau horaire */
.cs-table{min-width:1180px;font-size:14px}
.cs-table thead th{vertical-align:bottom;white-space:normal;min-width:86px;line-height:1.25}
.cs-table th:first-child{position:sticky;left:0;z-index:1;background:var(--surface);min-width:64px}
.cs-table td{white-space:nowrap}
.cs-table td.obs{white-space:normal;min-width:180px}
.cs-table tr.exp th:first-child{box-shadow:inset 4px 0 0 var(--accent);color:var(--accent);font-weight:700}
.cs-table tr.cur td,.cs-table tr.cur th{background:var(--info-soft)}
.cs-table tr.miss td{background:var(--warn-soft)}
.cs-table td.abn{background:var(--bad-soft);color:var(--bad);font-weight:700}
.cs-table tr.click{cursor:pointer}
.cs-table tr.click:hover td{filter:brightness(.97)}
.now{margin-bottom:16px;border-color:var(--accent)}
.nowlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.nowbtn{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;text-align:left;font:inherit}
.nowbtn span{display:grid}
.nowbtn small{opacity:.9}
.nowbtn.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.hlist{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.hrow:hover{background:var(--surface-2)}
.hrow .hh{font-family:var(--font-display);font-weight:600;font-size:18px}
.hrow.exp .hh{color:var(--accent)}
.hrow.cur{border-color:var(--info);box-shadow:inset 0 0 0 1px var(--info)}
.hrow.miss{background:var(--warn-soft);border-color:transparent}
.hb{display:grid;gap:4px;min-width:0}
.qtop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:14px}
.qf{display:grid;gap:6px;align-content:start;padding:10px;border-radius:12px;background:var(--surface-2);min-width:0}
.qf.full{grid-column:1/-1}
.qf .lbl{font-weight:700;font-size:14px}
.qf .qnum,.qta input{font-size:20px;min-height:52px;font-variant-numeric:tabular-nums}
.qta{display:flex;align-items:center;gap:8px}
.qta span{font-size:22px;color:var(--muted)}
.qf.abn{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad)}
.qf.abn .lbl{color:var(--bad)}
.rchip.alt input:checked+span{background:var(--bad);border-color:var(--bad);color:#fff}
.qsave{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);margin-bottom:-22px}
.qsave .spacer{margin-right:auto}
.cfs{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--surface-2)}
.pickres{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px}
.pick{display:flex;gap:12px;align-items:center;min-height:68px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit}
.pick:hover{border-color:var(--accent);background:var(--accent-soft)}
.pick>span{display:grid;gap:2px;justify-items:start}
.pick small{color:var(--muted)}
.cfs.focus{box-shadow:0 0 0 3px var(--accent);scroll-margin-top:12px}
.cinfo{display:grid;border-top:1px solid var(--line)}
.cinfo-row{display:grid;grid-template-columns:minmax(110px,max-content) minmax(0,1fr) auto;gap:4px 16px;align-items:start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 6px;cursor:pointer;font:inherit;color:inherit;border-radius:8px}
.cinfo-row:hover{background:var(--surface-2)}
.cinfo-row .k{color:var(--muted);font-size:14px}
.cinfo-row .ed{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:13px;font-weight:700}
@media (max-width:600px){.cinfo-row{grid-template-columns:minmax(0,1fr) auto}.cinfo-row .v{grid-column:1/-1;grid-row:2}}
.cfs h3{font-size:16px;display:flex;gap:10px;align-items:center}
.cfn{width:28px;height:28px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:14px}
.cfs .rchip span{min-height:44px}
.cprow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.7fr) minmax(0,.8fr) minmax(0,1.5fr) auto;gap:6px;align-items:center;margin-bottom:8px}
@media (max-width:600px){.cprow{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding-bottom:8px;border-bottom:1px solid var(--line)}}

/* Agenda mensuel */
.cal{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-h{background:var(--surface-2)}
.cal-h div{padding:8px 4px;text-align:center;font-weight:700;color:var(--muted);font-size:13px}
.cell{min-height:118px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px 4px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;background:var(--surface)}
.cell:nth-child(7n+1){border-left:0}
.cell:hover{background:var(--surface-2)}
.cell.out .dn{color:var(--muted);opacity:.55}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.dn{align-self:center;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-size:15px;font-variant-numeric:tabular-nums}
.cell.sun .dn{color:var(--bad)}
.cell.today .dn{background:var(--fg);color:var(--bg);font-weight:700}
.chip{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:2px 7px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;min-height:22px}
.chip:hover{filter:brightness(1.08)}
.more{font-size:12px;color:var(--muted);padding-left:4px}
.dots{display:none;gap:3px;justify-content:center;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%}
.ev{display:flex;gap:14px;width:100%;text-align:left;border:0;background:none;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;color:inherit;border-radius:8px}
.ev:hover{background:var(--surface-2)}
.ev-t{min-width:52px;font-weight:700;display:grid;align-content:start;gap:2px}
.ev-b{display:grid;gap:4px;justify-items:start;min-width:0}
.srow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.srow input[type=color]{width:52px;flex:none;padding:4px;cursor:pointer}
@media (max-width:700px){
  .cell{min-height:58px;padding:4px 2px}
  .cell .chip,.cell .more{display:none}
  .dots{display:flex}
  .dn{width:26px;height:26px;font-size:14px}
}

/* Selles */
.notice.alert{background:var(--bad-soft);color:var(--bad)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:14px 0 10px}
.sday{display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--muted)}
.sday.is-today .sd-l{color:var(--accent);font-weight:700}
.sd-dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.sd-dot.ok{background:var(--ok-soft);color:var(--ok)} .sd-dot.warn{background:var(--warn-soft);color:var(--warn)} .sd-dot.bad{background:var(--bad-soft);color:var(--bad)}
.sd-dot.none{border:1.5px dashed var(--line)}
.poo{display:block;flex:none}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.scol{display:grid;gap:6px;align-content:start;background:var(--surface-2);border-radius:12px;padding:8px}
.scol h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.srec{display:grid;justify-items:center;gap:1px;padding:6px 4px;border-radius:10px;border:0;cursor:pointer;background:var(--surface);font:inherit;font-size:13px;font-weight:700;color:var(--fg)}
.srec small{font-size:11px;font-weight:400;color:var(--muted)}
.srec.ok{box-shadow:inset 0 0 0 2px var(--ok)} .srec.warn{box-shadow:inset 0 0 0 2px var(--warn)} .srec.bad{box-shadow:inset 0 0 0 2px var(--bad)}
.sadd{min-height:64px;border:1.5px dashed var(--muted);border-radius:10px;background:var(--surface);color:var(--muted);cursor:pointer;font:inherit;font-size:13px;font-weight:700}

/* Éléments */

.list{display:grid;gap:12px}

.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}

.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}

.big{font-size:15px;color:var(--muted);margin-bottom:8px}

.av{width:40px;height:40px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--font-display);font-weight:600;font-size:15px;display:grid;place-items:center}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}

.check-inline{display:inline-flex;gap:8px;align-items:center;min-height:44px;cursor:pointer}

/* Médicaments */
.med-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px;align-items:start}

.med-do{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* Tableaux */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}

@media (max-width:760px){.shhead{display:none}.shrow{grid-template-columns:40px minmax(0,1fr) minmax(0,1fr);padding-bottom:10px;border-bottom:1px solid var(--line)}.shrow .se-l{grid-column:2/4}.shrow .se-p{grid-column:1/2}.shrow .se-desc{grid-column:2/4}.shrow [data-serm]{grid-column:1/-1;justify-self:end}}
.sh-bar.sh-M{background:var(--info)} .sh-bar.sh-J{background:var(--accent)} .sh-bar.sh-I{background:var(--ok)} .sh-bar.sh-S{background:var(--warn)} .sh-bar.sh-L{background:var(--bad)} .sh-bar.sh-N{background:var(--night)} .sh-bar.sh-F{background:var(--muted);box-shadow:none}

td.restbad{background:var(--bad-soft)}

@media (max-width:600px){.phases{grid-template-columns:minmax(0,1fr)}}
tr.me-row th,tr.me-row td{background:var(--accent-soft)}
details.hcat>summary{cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:17px;display:flex;gap:8px;align-items:center;min-height:32px}

.shift[disabled]{opacity:.8;cursor:not-allowed}

@media (max-width:860px){.sh-row,.sh-scale{grid-template-columns:minmax(0,1fr);gap:6px}.sh-scale>div:first-child,.sh-scale>div:last-child{display:none}.sh-row{padding-bottom:10px;border-bottom:1px solid var(--line)}}

/* Écran de connexion : univers prune et rose du logo, assumé dans les deux thèmes */

.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:#f7c4d6;font-weight:700;cursor:pointer;min-height:40px;padding:0 10px}
.gate-err{color:#ffab98;font-weight:700;min-height:1.5em;margin:0}
.gate-ok{background:rgba(120,170,90,.18);color:#d3ebbf;padding:10px 14px;border-radius:10px;max-width:60ch;margin:0}
.gate-who{display:flex;gap:12px;align-items:center}
.gate-photo{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.gate-photo label:focus-within{outline:3px solid #f7c4d6;outline-offset:3px}
.gcheck{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer}
.gcheck input{width:20px;height:20px;min-height:0;accent-color:#f2a7c0}
.gate-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.mlist{display:grid;gap:8px;width:min(660px,100%)}
.mrow{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;background:rgba(255,225,236,.05);border:1px solid rgba(201,188,176,.25);color:inherit;cursor:pointer;text-align:left;width:100%}
.mrow:hover{background:rgba(255,225,236,.11)}
.mtxt{display:grid;flex:1;min-width:0}
.mtxt span{color:#dcc5cf;font-size:14px}
.mtags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.gtag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(242,167,192,.2);color:#f7c4d6;white-space:nowrap}
.gtag.ok{background:rgba(120,190,110,.2);color:#b9e3a6}
.gtag.off{background:rgba(255,255,255,.08);color:#c6adb9}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}

@media (max-width:1100px){
  .week{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
  .two-col{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  main{padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar h1{font-size:23px}
  .nav-brand{display:none}
  .tabbar{padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
  .tabs{grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
  .tab{flex-direction:column;gap:1px;font-size:11.5px;min-height:46px;padding:3px 2px}
  .tab .l-full{display:none}
  .tab .l-short{display:block}
  .tab .badge{right:calc(50% - 24px)}
}
@media (max-width:600px){
  .overlay{align-items:flex-end;padding:0}
  .sheet,.sheet.wide{border-radius:18px 18px 0 0;max-height:92dvh;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  .kv{grid-template-columns:minmax(0,1fr);gap:2px}
  .kv dd{margin-bottom:8px}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}
}
.unread-dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--bad,#c0392b);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad,#c0392b) 22%,transparent);margin-right:8px;vertical-align:middle;flex:none}
</style>

<div class="app">
  <nav class="tabbar" id="tabbar" aria-label="Navigation principale"></nav>
  <header class="mbar" id="mbar"></header>

</div>

/* ---------- Vue : Contention ---------- */
const hourOf=h=>parseInt(String(h||"0").slice(0,2),10)||0;
function inWin(c,hr){if(!c.debutH||!c.finH)return false;const s=hourOf(c.debutH),e=hourOf(c.finH),f=+c.freq||1;const w=s===e?true:s<=e?(hr>=s&&hr<e):(hr>=s||hr<e);return w&&((hr-s+24)%f===0);}
function cpAbn(p,val){
 if(val===""||val==null)return false;
 if(p.type==="num"){const n=parseFloat(String(val).replace(",","."));if(isNaN(n))return false;return (p.min!==""&&p.min!=null&&n<+p.min)||(p.max!==""&&p.max!=null&&n>+p.max);}
 if(p.type==="tension"){const m=/^(\d{2,3})\s*\/\s*(\d{2,3})/.exec(String(val));if(!m)return false;const sy=+m[1],di=+m[2];return sy>=160||sy<90||di>=100||di<50;}
 if(p.type==="choix")return (p.alertes||[]).includes(val);
 return false;
}
function missingHours(c,date){
 if(!c.debutH||!c.finH)return [];
 const lim=date<TODAY?24:date===TODAY?new Date().getHours():0;
 const out=[];for(let hr=0;hr<lim;hr++){if(inWin(c,hr)&&!c.surv.some(s=>s.date===date&&hourOf(s.h)===hr))out.push(hr);}
 return out;
}

/* ---------- Vue : Transmissions ---------- */
function trKind(t){return t.kind||"carnet";}
function trTabsFor(){const s=ST(state.me);return isLimited()?[roleOf(s)]:TR_TABS.map(x=>x[0]);}
function trCanDo(k){const s=ST(state.me);if(!s)return false;if(s.admin)return true;if(k==="direction")return false;if(k==="medical"&&!isLimited())return true;return roleOf(s)===k;}function trTodo(k){return state.transmissions.filter(t=>t.kind===k&&t.statut==="afaire");}
function trMyTodo(){const s=ST(state.me);if(!s)return 0;if(s.admin)return DEST.reduce((n,k)=>n+trTodo(k).length,0);const r=roleOf(s);return DEST.includes(r)?trTodo(r).length:0;}
function trTabBadge(k){if(DEST.includes(k))return trCanDo(k)?trTodo(k).length:0;return state.transmissions.filter(t=>trKind(t)===k&&t.imp&&!t.lus.includes(state.me)).length;}
function trWho(t){const s=ST(t.par);return `par ${esc(sname(t.par))}${s&&s.fonction?` (${esc(s.fonction)})`:""}`;}
function trAdminBtns(t){return isAdmin()?`<button class="btn sm ghost" data-act="tr-edit" data-id="${t.id}">${icon("edit",16)} Modifier</button><button class="btn sm ghost" data-act="tr-del" data-id="${t.id}">Supprimer</button>`:"";}
function trReadFoot(t){const read=t.lus.includes(state.me);return `<div class="tr-foot"><span>Lu par : ${t.lus.length?t.lus.map(id=>esc(sname(id))).join(", "):"personne"}</span><span class="row">${trAdminBtns(t)}${read?`<span class="pill ok">${icon("check",14)} Lu</span>`:`<button class="btn sm" data-act="tr-read" data-id="${t.id}">${icon("check",16)} Marquer comme lu</button>`}</span></div>`;}
const unDot=()=>`<span class="unread-dot" title="Pas encore lu" aria-label="Pas encore lu"></span>`;
function trCard(t){
 const k=trKind(t),un=!DEST.includes(k)&&!t.lus.includes(state.me),time=`${un?unDot():""}<strong class="num" style="color:var(--fg)">${hm(t.dt.slice(11))}</strong>`;
 if(k==="admin"){const r=R(t.rid);
  const rows=[["Activité ou moment",t.quand],["Comment ça s'est passé",t.deroule],["Comportement",t.comportement],["Capacités observées",t.capacites]].filter(x=>x[1]);
  return `<article class="card tr" style="margin-bottom:12px"><div class="row-between" style="margin-bottom:8px"><div class="who">${r?avatar(r):""}<div><strong>${un?unDot():""}${esc(rname(r))}</strong><span class="muted small">${hm(t.dt.slice(11))} · ${trWho(t)}</span></div></div>${t.imp?`<span class="pill bad">Important</span>`:""}</div>

 if(DEST.includes(k)){const done=t.statut==="fait";
  return `<article class="card tr${done?"":" todo"}" style="margin-bottom:12px"><div class="tr-meta">${time}${t.imp?`<span class="pill bad">Urgent</span>`:""}${done?`<span class="pill ok">${icon("check",14)} Fait</span>`:`<span class="pill warn">À faire</span>`}<span>${trWho(t)}</span></div>
   <h3 class="tr-obj">${esc(t.objet||"Information")}</h3>${t.lieu?`<p class="muted small" style="margin:0 0 4px">Lieu : ${esc(t.lieu)}</p>`:""}${t.texte?`<p class="tr-text">${esc(t.texte)}</p>`:""}
   ${done?`<p class="small" style="margin-top:8px"><strong>Fait par ${esc(sname(t.faitPar))}</strong>, ${esc(dayLabel(t.faitLe.slice(0,10)).toLowerCase())} à ${hm(t.faitLe.slice(11))}${t.faitNote?` : ${esc(t.faitNote)}`:""}</p>`:""}
   <div class="tr-foot"><span></span><span class="row">${trAdminBtns(t)}${!done&&trCanDo(k)?`<button class="btn sm primary" data-act="tr-done" data-id="${t.id}">${icon("check",16)} Marquer comme fait</button>`:""}</span></div></article>`;}
 return `<article class="card tr" style="margin-bottom:12px"><div class="tr-meta">${time}${t.moment?`<span class="pill info">${esc(t.moment)}</span>`:t.cat?`<span class="pill info">${esc(t.cat)}</span>`:""}${t.imp?`<span class="pill bad">Important</span>`:""}${t.rid?`<strong style="color:var(--fg)">${esc(rname(R(t.rid)))}</strong>`:""}<span>${trWho(t)}</span></div>

DEM_TYPES.push(["changement","Changement d'horaire"]);
const monthDays=m=>{const out=[];let d=m+"-01";while(d.startsWith(m)){out.push(d);d=addDays(d,1);}return out;};
const isWE=d=>{const w=new Date(d+"T12:00:00").getDay();return w===0||w===6;};
const dcl=d=>(isHoliday(d)?" fe":isWE(d)?" we":"");
const shLegend=()=>`<div class="chips">${Object.keys(SHIFTS).map(k=>`<span class="pill sh-${k}"><strong>${esc(k)}</strong>&nbsp;${esc(SHIFTS[k].l)}${SHIFTS[k].h?" · "+esc(SHIFTS[k].h):""}</span>`).join("")}</div><div class="cal-key"><span><i style="background:color-mix(in srgb,var(--info) 30%,var(--surface))"></i>Week-end</span><span><i style="background:color-mix(in srgb,var(--accent) 40%,var(--surface))"></i>Jour férié</span></div>`;
function monthCard(m){
 const ph=planPhase(m),pd=pubDate(m),ld=lockDate(m),sel=ui.hMonth===m;
 const steps=[["prep","Brouillon caché",`jusqu'au ${dShort(addDays(pd,-1))}`,"L'équipe ne le voit pas"],["open","Visible, modifiable",`du ${dShort(pd)} au ${dShort(ld)}`,"Ajusté selon les demandes"],["final","Définitif",`à partir du ${dShort(addDays(ld,1))}`,"Plus aucune modification"]];
 const idx=steps.findIndex(s=>s[0]===ph);
 return `<div class="mcard${sel?" sel":""}" data-act="hm-month" data-m="${m}" role="button" tabindex="0" aria-pressed="${sel}"><div><strong>${esc(cap(monthName(m)))}</strong><div class="muted small">${sel?"Affiché ci-dessous":ph==="final"?"Touchez pour le consulter":"Touchez pour le créer ou le modifier"}</div></div>
  <ol class="phases">${steps.map((s,i)=>`<li class="${i<idx?"past":i===idx?"now":""}"><strong>${esc(s[1])}</strong><span>${esc(s[2])}</span><small>${esc(s[3])}</small></li>`).join("")}</ol></div>`;
}
function demItem(d){
 const adm=isAdmin(),s=ST(d.sid);
 const st=d.statut==="attente"?`<span class="pill warn">En attente</span>`:d.statut==="acceptee"?`<span class="pill ok">Acceptée</span>`:`<span class="pill bad">Refusée</span>`;
 const when=d.du===d.au?`Le ${fmtDate(d.du)}`:`Du ${fmtDate(d.du)} au ${fmtDate(d.au)}`;
 const extra=d.type==="changement"?` · ${d.actuel&&SHIFTS[d.actuel]?esc(SHIFTS[d.actuel].l):"aucun horaire"} → <strong>${d.horaire&&SHIFTS[d.horaire]?esc(SHIFTS[d.horaire].l):"—"}</strong>`:(d.horaire&&SHIFTS[d.horaire]?` · souhaite : ${esc(SHIFTS[d.horaire].l)}`:"");
 return `<article class="card"><div class="row-between"><div><strong>${esc(demLabel(d.type))}</strong>${d.avec?` avec ${esc(sname(d.avec))}`:""}${!adm&&d.avec===state.me?` · demandée par ${esc(sname(d.sid))}`:""}${adm?` · ${esc(s?s.prenom+" "+s.nom:"Profil supprimé")}`:""}<div class="muted small">${esc(when)}${extra}</div></div>${st}</div>
  ${d.detail?`<p class="small" style="margin-top:6px">${esc(d.detail)}</p>`:""}
  ${d.reponse?`<p class="small" style="margin-top:6px"><strong>Réponse de la direction :</strong> ${esc(d.reponse)}</p>`:""}
  <p class="muted small" style="margin-top:4px">Demande envoyée le ${esc(fmtDate(d.createdAt))}</p>
  ${adm&&d.statut==="attente"?`<div class="row" style="margin-top:10px"><button class="btn sm ok" data-act="dem-ok" data-id="${d.id}">${icon("check",16)} Accepter</button><button class="btn sm bad" data-act="dem-no" data-id="${d.id}">Refuser</button></div>`:""}
  ${!adm&&d.sid===state.me&&d.statut==="attente"?`<div class="row" style="margin-top:10px"><button class="btn sm ghost" data-act="dem-cancel" data-id="${d.id}">Annuler ma demande</button></div>`:""}</article>`;
}
function demLists(list,emptyTxt,doneTitle){
 const pend=list.filter(d=>d.statut==="attente").sort((a,b)=>a.du.localeCompare(b.du));
 const done=list.filter(d=>d.statut!=="attente").sort((a,b)=>(b.decidedAt||"").localeCompare(a.decidedAt||"")).slice(0,15);
 return `${pend.length?`<div class="med-grid">${pend.map(demItem).join("")}</div>`:`<p class="empty">${esc(emptyTxt)}</p>`}
  ${done.length?`<h3 style="font-size:15px;margin:18px 0 10px">${esc(doneTitle)}</h3><div class="med-grid">${done.map(demItem).join("")}</div>`:""}`;
}
function demForm(preType){
 const types=DEM_TYPES.filter(t=>!["changement","repos","echange"].includes(t[0])||t[0]===preType);
 const radio=(name,opts)=>`<div class="rchips" role="radiogroup">${opts.map(([k,l])=>`<label class="rchip"><input type="radio" class="sr" name="${name}" value="${esc(k)}"><span>${esc(l)}</span></label>`).join("")}</div>`;
 openModal(preType?demLabel(preType):"Faire une demande",`<form id="dform" class="stack" novalidate>
  <div class="field"${preType?" hidden":""}><span class="lbl">Type de demande</span>${radio("df-type",types)}</div>
  <div class="field" id="df-avw"${preType==="echange"?"":" hidden"}><label for="df-avec">Avec quel collègue ?</label><select id="df-avec"><option value="">Choisir un collègue…</option>${state.staff.filter(s=>s.id!==state.me&&!s.admin&&!["technicien","ouvrier"].includes(roleOf(s))).map(s=>`<option value="${s.id}">${esc(s.prenom+" "+s.nom)}${s.fonction?" ("+esc(s.fonction)+")":""}</option>`).join("")}</select><span class="hint">Cette personne recevra aussi la réponse de la direction.</span></div>
  <div class="qtop"><div class="field"><label for="df-du">Du</label><input type="date" id="df-du" min="${TODAY}"></div><div class="field"><label for="df-au">Au (inclus)</label><input type="date" id="df-au" min="${TODAY}"></div></div>
  <div class="field" id="df-hwrap" hidden><span class="lbl">Horaire souhaité</span>${radio("df-h",workCodes().filter(k=>k!=="F").map(k=>[k,`${SHIFTS[k].l} (${SHIFTS[k].h})`]))}</div>
  <div class="field"><label for="df-det">Précisions</label><textarea id="df-det" rows="3" placeholder="Ex. : mariage d'un proche, rendez-vous…"></textarea></div>
  <p class="notice" id="df-warn" style="margin:0" hidden></p>
  <p class="mnote" id="df-err" role="alert"></p>
  <div class="form-actions"><button type="button" class="btn" data-act="close">Annuler</button><button class="btn primary" type="submit">Envoyer la demande</button></div></form>`);
 const f=$("dform"),rv=n=>{const i=f.querySelector(`input[name="${n}"]:checked`);return i?i.value:"";};
 if(preType){const r0=f.querySelector(`input[name="df-type"][value="${preType}"]`);if(r0){r0.checked=true;$("df-hwrap").hidden=preType!=="desid";}}
 const warn=()=>{const du=$("df-du").value,w=$("df-warn");if(!du){w.hidden=true;return;}const m=monthOf(du),ph=planPhase(m);w.hidden=false;
  w.textContent=ph==="final"?`Le planning de ${monthName(m)} est définitif : il n'est plus possible de faire une demande pour ce mois.`:ph==="open"?`Le planning de ${monthName(m)} est visible et provisoire : la direction peut encore l'ajuster jusqu'au ${dShort(lockDate(m))}.`:`Le planning de ${monthName(m)} est en préparation : votre demande pourra être prise en compte avant qu'il soit visible, le ${dShort(pubDate(m))}.`;};
 f.addEventListener("change",e=>{if(e.target.name==="df-type"){$("df-hwrap").hidden=e.target.value!=="desid";$("df-avw").hidden=e.target.value!=="echange";}if(e.target.id==="df-du"){if(!$("df-au").value||$("df-au").value<e.target.value)$("df-au").value=e.target.value;warn();}});
 f.addEventListener("submit",e=>{e.preventDefault();const err=$("df-err");
  const type=rv("df-type"),du=$("df-du").value,au=$("df-au").value,h=rv("df-h"),det=$("df-det").value.trim();
  if(!type){err.textContent="Choisissez le type de demande.";return;}
  if(!du||!au){err.textContent="Indiquez les dates de début et de fin.";return;}
  if(du<TODAY){err.textContent="La date de début doit être aujourd'hui ou plus tard.";return;}
  if(au<du){err.textContent="La date de fin doit être après la date de début.";return;}
  if(isLocked(monthOf(du))||isLocked(monthOf(au))){err.textContent="Ce planning est définitif : il n'est plus possible de faire une demande pour ces dates.";return;}
  if(type==="desid"&&!h){err.textContent="Choisissez l'horaire souhaité.";return;}
  if(type==="echange"&&!$("df-avec").value){err.textContent="Choisissez le collègue avec qui vous voulez échanger.";return;}
  if(type==="autre"&&!det){err.textContent="Expliquez votre demande dans les précisions.";return;}
  state.demandes.push({id:uid(),sid:state.me,type,du,au,horaire:type==="desid"?h:"",avec:type==="echange"?$("df-avec").value:"",detail:det,createdAt:TODAY,statut:"attente"});
  save();closeModal();render();toast("Demande envoyée à la direction");});
}
const openChangeMonth=()=>{const cm=monthOf(TODAY);return [cm,nextMonth(cm)].find(m=>planPhase(m)==="open")||"";};
function chgForm(){
 const m=openChangeMonth();if(!m){toast("Les demandes de changement sont fermées pour le moment.");return;}
 const days=monthDays(m);
 const radio=(name,opts)=>`<div class="rchips" role="radiogroup">${opts.map(([k,l])=>`<label class="rchip"><input type="radio" class="sr" name="${name}" value="${esc(k)}"><span>${esc(l)}</span></label>`).join("")}</div>`;
 openModal("Demander un changement d'horaire",`<form id="chform" class="stack" novalidate>
  <p class="muted small" style="margin:0">Planning de ${esc(monthName(m))}. Demande possible jusqu'au ${esc(dShort(lockDate(m)))}.</p>
  <div class="field" style="max-width:260px"><label for="ch-date">Jour concerné</label><input type="date" id="ch-date" min="${days[0]}" max="${days[days.length-1]}"></div>
  <p class="small" id="ch-cur" style="margin:0"></p>
  <div class="field"><span class="lbl">Horaire souhaité</span>${radio("ch-h",workCodes().filter(k=>k!=="F").map(k=>[k,`${SHIFTS[k].l} (${SHIFTS[k].h})`]).concat([["R","Repos"]]))}</div>
  <div class="field"><label for="ch-det">Pourquoi</label><textarea id="ch-det" rows="3" placeholder="Ex. : rendez-vous médical le matin, échange prévu avec Membre n°2…"></textarea></div>
  <p class="mnote" id="ch-err" role="alert"></p>
  <div class="form-actions"><button type="button" class="btn" data-act="close">Annuler</button><button class="btn primary" type="submit">Envoyer la demande</button></div></form>`);
 const f=$("chform");
 $("ch-date").addEventListener("change",()=>{const d=$("ch-date").value,c=d?shiftAt(state.me,d):"";$("ch-cur").textContent=d?`Horaire prévu ce jour-là : ${c&&SHIFTS[c]?SHIFTS[c].l+(SHIFTS[c].h?" ("+SHIFTS[c].h+")":""):"aucun"}.`:"";});
 f.addEventListener("submit",e=>{e.preventDefault();const err=$("ch-err"),d=$("ch-date").value,i=f.querySelector('input[name="ch-h"]:checked'),det=$("ch-det").value.trim();
  if(!d||!d.startsWith(m)){err.textContent=`Choisissez un jour de ${monthName(m)}.`;return;}
  if(planPhase(m)!=="open"){err.textContent="Les demandes de changement sont fermées pour ce mois.";return;}
  if(!i){err.textContent="Choisissez l'horaire souhaité.";return;}
  const cur=shiftAt(state.me,d);if(i.value===cur){err.textContent="C'est déjà votre horaire ce jour-là.";return;}
  if(!det){err.textContent="Expliquez pourquoi vous demandez ce changement.";return;}
  state.demandes.push({id:uid(),sid:state.me,type:"changement",du:d,au:d,actuel:cur,horaire:i.value,detail:det,createdAt:TODAY,statut:"attente"});
  save();closeModal();render();toast("Demande de changement envoyée à la direction");});
}
function shiftPicker(k){
 if(!isAdmin())return;const [d,sid]=k.split("|"),s=ST(sid);if(admLocked(monthOf(d))){toast("Ce planning est définitif.");return;}
 const cur=shiftAt(sid,d);
 openModal(`${s?s.prenom+" "+s.nom:""} · ${cap(fmtDay(d))}`,`<div class="pickgrid">${Object.keys(SHIFTS).map(c=>`<button type="button" class="pickshift sh-${c}${c===cur?" cur":""}" data-code="${c}"><strong>${esc(c)} · ${esc(SHIFTS[c].l)}</strong><span>${esc(SHIFTS[c].h||"")}</span></button>`).join("")}<button type="button" class="pickshift" data-code=""><strong>Vider la case</strong><span>Aucun horaire</span></button></div>`);
 $("modal-root").querySelectorAll("[data-code]").forEach(b=>b.addEventListener("click",()=>{const c=b.dataset.code;if(c)state.shifts[k]=c;else delete state.shifts[k];save();closeModal();render();}));
}
function vHor(){if(!/^\d{4}-\d{2}$/.test(ui.hMonth))ui.hMonth=nextMonth(monthOf(TODAY));if(!/^\d{4}-\d{2}$/.test(ui.hMonthS))ui.hMonthS=monthOf(TODAY);return isAdmin()?vHorAdmin():vHorStaff();}
function vHorAdmin(){
 const m=ui.hMonth,days=monthDays(m),lk=admLocked(m),ph=planPhase(m);
 const span=1560,pos=x=>(x-360)/span*100;
 const ticks=[6,9,12,15,18,21,24,27,30].map(h=>`<span style="left:${pos(h*60)}%">${h%24}h</span>`).join("");
 const trans=relays().map(([a,b])=>`<span class="sh-tr" style="left:${pos(tmin(a))}%;width:${(tmin(b)-tmin(a))/span*100}%" title="Transmissions ${hm(a)} – ${hm(b)}"></span>`).join("");
 const cat=workCodes().map(k=>{const s=SHIFTS[k],sp=shiftSpan(k);return `<div class="sh-row"><div class="sh-name"><span class="pill sh-${k}">${esc(s.l)}</span><span class="num">${esc(s.h)}</span></div><div class="sh-track"><span class="sh-bar sh-${k}" style="left:${pos(sp.a)}%;width:${(sp.b-sp.a)/span*100}%"></span>${trans}</div><div class="small"><strong>${fmtDur(effMin(k))} de travail</strong>${effMin(k)>720?` <span class="pill bad">Plus de 12 h</span>`:""}${s.p?` · pause ${s.p} min`:" · pause prise sur place"}<div class="muted">${esc(s.desc||"")}</div></div></div>`;}).join("");
 const catalog=`<details class="card hcat" style="margin-top:22px"><summary>${icon("clock")} Les horaires de travail et leurs règles</summary>
   <div class="row" style="justify-content:space-between;margin:10px 0 6px"><span class="muted small">Les zones hachurées sont les temps de transmission</span><button class="btn sm primary" data-act="sh-edit">${icon("edit",16)} Modifier les horaires</button></div>
   <div class="sh-scale"><div></div><div class="sh-ticks" aria-hidden="true">${ticks}</div><div></div></div><div class="sh-cat">${cat}</div>
   <ul class="rules" style="margin-top:16px">${SHIFTS.N?`<li><strong>Une seule nuit, toujours la même : ${esc(SHIFTS.N.h)}.</strong></li>`:""}${relays().length?`<li><strong>Transmissions</strong> : ${relays().map(([a,b,l])=>`${l} de ${hm(a)} à ${hm(b)}`).join(", ")}.</li>`:""}<li><strong>Au moins 11 heures de repos</strong> entre deux postes (les cases concernées passent en rouge).</li><li><strong>48 heures maximum par semaine.</strong></li></ul></details>`;
 const cm=monthOf(TODAY),months=[cm,nextMonth(cm),nextMonth(nextMonth(cm))];
 if(!months.includes(m))months.push(m);
 let restIssues=0;
 const head=`<tr><th>Professionnel</th>${days.map(d=>`<th class="dayh${dcl(d)}${d===TODAY?" today":""}">${+d.slice(8)}<div class="muted" style="font-weight:400">${esc(fmtDay(d,{weekday:"narrow"}))}</div>${isHoliday(d)?`<span class="fe-l">Férié</span>`:""}</th>`).join("")}<th>Total</th></tr>`;
 const rows=state.staff.map(s=>{let tot=0;const cells=days.map(d=>{const c=shiftAt(s.id,d);tot+=effMin(c);const r=restBefore(s.id,d),bad=r!=null&&r<660;if(bad)restIssues++;
   return `<td class="mc-td${dcl(d)}${d===TODAY?" today":""}${bad?" restbad":""}"><button class="cellbtn sh-${c}" data-act="hm-cell" data-k="${d}|${s.id}"${lk?" disabled":""} title="${esc(cap(fmtDay(d)))} · ${c&&SHIFTS[c]?esc(SHIFTS[c].l+(SHIFTS[c].h?" "+SHIFTS[c].h:"")):"vide"}${bad?` · repos ${fmtDur(Math.max(0,r))} seulement`:""}">${c?esc(c):"·"}</button></td>`;}).join("");
  return `<tr><th scope="row" class="mc-name">${esc(s.prenom+" "+s.nom)}<div class="muted small" style="font-weight:400">${esc(s.fonction||"")}</div></th>${cells}<td class="num"><span class="pill">${fmtDur(tot)}</span></td></tr>`;}).join("");
 const cov=`<tr class="sep"><th colspan="${days.length+2}">Présents aux moments clés</th></tr>`+MOMS.map(([t,l,min])=>`<tr><th scope="row" class="mc-name">${esc(l)}<div class="muted small" style="font-weight:400">${hm(t)} · min. ${min}</div></th>${days.map(d=>{const n=presentAt(d,t);return `<td class="mc-td${dcl(d)}"><span class="covn ${n<min?"bad":"ok"}">${n}</span></td>`;}).join("")}<td></td></tr>`).join("");
 const pend=state.demandes.filter(d=>d.statut==="attente").sort((a,b)=>a.du.localeCompare(b.du));
 const phasePill=ph==="prep"?`<span class="pill warn">Brouillon caché : l'équipe ne le voit pas</span>`:ph==="open"?`<span class="pill info">Visible par l'équipe · modifiable jusqu'au ${esc(dShort(lockDate(m)))}</span>`:`<span class="pill">${icon("lock",14)} Définitif</span>`;
 return topbar("Horaires de l'équipe","Créer, ajuster et suivre les plannings du mois")+
  `<div class="notice">${icon("info",18)}<span><strong>Le planning du mois suivant est préparé en brouillon caché.</strong> Le 10 du mois (ou le jour ouvrable suivant), il devient visible et reste modifiable selon les demandes jusqu'au 21. <strong>Après le 21, il est définitif.</strong></span></div>
  <section class="card" style="margin-bottom:18px"><div class="card-h"><h2>${icon("cal")} Les plannings</h2><span class="muted small">Touchez un mois pour l'afficher</span></div><div class="mcards">${months.map(monthCard).join("")}</div></section>
  ${pend.length?`<section class="card" style="margin-bottom:18px;border-color:var(--warn)"><div class="card-h"><h2>${icon("info")} ${pend.length} demande${pend.length>1?"s":""} à traiter</h2><button class="btn sm" data-act="go" data-v="conges">Voir toutes les demandes</button></div><div class="med-grid">${pend.slice(0,4).map(demItem).join("")}</div></section>`:""}
  <div class="section-title" style="margin-top:0"><h2>Planning de ${esc(monthName(m))}</h2><div class="chips">${phasePill}</div></div>
  <div class="toolbar" style="justify-content:space-between"><div class="datenav"><button class="btn icon" data-act="hm-nav" data-n="-1" aria-label="Mois précédent">${icon("left")}</button><button class="btn sm" data-act="hm-nav" data-n="0">Mois en cours</button><button class="btn icon" data-act="hm-nav" data-n="1" aria-label="Mois suivant">${icon("right")}</button></div>
   ${lk?"":`<div class="row"><button class="btn sm" data-act="hm-copy">Recopier le mois précédent</button><button class="btn sm ghost" data-act="hm-clear">Vider ce planning</button></div>`}</div>
  ${restIssues?`<div class="notice alert">${icon("info",18)}<span>${restIssues} enchaînement${restIssues>1?"s":""} avec moins de 11 heures de repos dans ce mois (cases en rouge).</span></div>`:""}
  <p class="muted small" style="margin:0 0 8px">${lk?"Ce planning est définitif : il ne peut plus être modifié.":isLocked(m)?"Définitif pour l'équipe, mais vous pouvez toujours le modifier ici. Touchez une case pour changer l'horaire.":"Touchez une case pour choisir l'horaire de la personne ce jour-là."}</p>
  ${shLegend()}
  <div class="table-wrap" style="margin-top:10px"><table class="mc-table"><thead>${head}</thead><tbody>${rows}${cov}</tbody></table></div>
  ${catalog}`;
}
function vHorStaff(){
 const m=ui.hMonthS,days=monthDays(m),ph=planPhase(m);
 const om=openChangeMonth();
 const nav=`<div class="datenav"><button class="btn icon" data-act="hs-nav" data-n="-1" aria-label="Mois précédent">${icon("left")}</button><strong>${esc(cap(monthName(m)))}</strong><button class="btn icon" data-act="hs-nav" data-n="1" aria-label="Mois suivant">${icon("right")}</button>${m!==monthOf(TODAY)?`<button class="btn sm ghost" data-act="hs-nav" data-n="0">Mois en cours</button>`:""}</div>`;
 const chg=om?`<div class="card chgbox"><div><strong>Besoin d'un autre horaire ?</strong><p class="muted small" style="margin:2px 0 0">Pour le planning de ${esc(monthName(om))}, jusqu'au ${esc(dShort(lockDate(om)))}.</p></div><div class="row"><button class="btn primary" data-act="chg-new">${icon("edit",18)} Demander un changement d'horaire</button><button class="btn" data-act="dem-type" data-t="echange">${icon("users",18)} Échange avec un collègue</button></div></div>`
  :`<div class="card chgbox"><div><strong>Demande de changement d'horaire</strong><p class="muted small" style="margin:2px 0 0">Possible du 10 au 21 de chaque mois, pour le planning du mois suivant. Pour un congé ou un désiderata, utilisez l'onglet Congés.</p></div><div class="row"><button class="btn" disabled>Demander un changement d'horaire</button><button class="btn" data-act="dem-type" data-t="echange">${icon("users",18)} Échange avec un collègue</button></div></div>`;
 let body;
 if(ph==="prep")body=`<div class="card" style="text-align:center;padding:28px 16px"><strong style="font-size:17px">Le planning de ${esc(monthName(m))} n'est pas encore visible</strong><p class="muted" style="margin-top:6px">Il le sera à partir du ${esc(fmtDay(pubDate(m)))}.</p></div>`;
 else{

function fieldHtml(f,val){

 let input;
 if(f.type==="textarea")input=`<textarea id="${id}" name="${f.name}"${req}>${esc(val)}</textarea>`;
 else if(f.type==="select")input=`<select id="${id}" name="${f.name}"${req}>${f.options.map(([v,l])=>`<option value="${esc(v)}"${String(val==null?"":val)===String(v)?" selected":""}>${esc(l)}</option>`).join("")}</select>`;
 else if(f.type==="checks")return `<div class="field${f.full?" full":""}" data-f="${f.name}"><span class="lbl" id="${id}">${esc(f.label)}${star}</span><div class="checks" role="group" aria-labelledby="${id}">${f.options.map(([v,l])=>`<label class="check"><input type="checkbox" name="${f.name}" value="${esc(v)}"${(val||[]).includes(v)?" checked":""}> ${esc(l)}</label>`).join("")}</div>${f.hint?`<span class="hint">${esc(f.hint)}</span>`:""}</div>`;
 else if(f.type==="checkbox")return `<div class="field${f.full?" full":""}" data-f="${f.name}"><label class="check-inline" for="${id}"><input type="checkbox" id="${id}" name="${f.name}"${val?" checked":""}> ${esc(f.label)}</label></div>`;
 else input=`<input id="${id}" name="${f.name}" type="${f.type||"text"}" value="${esc(val)}"${req}>`;
 return `<div class="field${f.full?" full":""}" data-f="${f.name}"><label for="${id}">${esc(f.label)}${star}</label>${input}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:""}</div>`;
}

  <div class="form-actions full">${o.onDelete?`<button type="button" class="btn bad spacer" id="mdel">${esc(o.deleteLabel||"Supprimer")}</button>`:""}<button type="button" class="btn" data-act="close">Annuler</button><button class="btn primary" type="submit">${esc(o.submit||"Enregistrer")}</button></div></form>`);

  e.preventDefault();const x={};let ok=true;
  o.fields.forEach(f=>{
   const box=form.querySelector(`[data-f="${f.name}"]`);
   if(f.type==="checks")x[f.name]=[...form.querySelectorAll(`input[name="${f.name}"]:checked`)].map(i=>i.value);

});
document.addEventListener("input",e=>{

document.addEventListener("submit",e=>{

 state.messages.push({id:uid(),canal:ui.canal,dt:`${TODAY}T${nowHM()}`,par:state.me,texte:txt});save();render();

});

function sha256hex(msg){
 const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
 const d=new TextEncoder().encode(msg),l=d.length,nb=((l+9+63)>>6)<<6,m=new Uint8Array(nb);m.set(d);m[l]=0x80;
 const dv=new DataView(m.buffer),bits=l*8;dv.setUint32(nb-4,bits>>>0);dv.setUint32(nb-8,Math.floor(bits/4294967296));
 const r=(x,n)=>(x>>>n)|(x<<(32-n)),w=new Array(64);let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
 for(let o=0;o<nb;o+=64){
  for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
  for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;}
  let A=h[0],B=h[1],C=h[2],D=h[3],E=h[4],F=h[5],G2=h[6],H=h[7];
  for(let i=0;i<64;i++){const S1=r(E,6)^r(E,11)^r(E,25),ch=(E&F)^(~E&G2),t1=(H+S1+ch+K[i]+w[i])>>>0,S0=r(A,2)^r(A,13)^r(A,22),mj=(A&B)^(A&C)^(B&C),t2=(S0+mj)>>>0;H=G2;G2=F;F=E;E=(D+t1)>>>0;D=C;C=B;B=A;A=(t1+t2)>>>0;}
  h=[h[0]+A,h[1]+B,h[2]+C,h[3]+D,h[4]+E,h[5]+F,h[6]+G2,h[7]+H].map(x=>x>>>0);
 }
 return h.map(x=>x.toString(16).padStart(8,"0")).join("");
}
async function pwdOk(pwd,s){
 if(!s||!s.hash)return false;
 if(await hashPwd(pwd,s.salt)===s.hash)return true;
 if(/^f[0-9a-f]{1,8}$/.test(s.hash)){let h=5381;for(const c of new TextEncoder().encode(s.salt+":"+pwd))h=((h<<5)+h+c)>>>0;return "f"+h.toString(16)===s.hash;}
 return false;
}
async function hashPwd(pwd,salt){
 return sha256hex(salt+":"+pwd);
}
function readPhoto(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const z=256,c=document.createElement("canvas");c.width=c.height=z;const m=Math.min(img.width,img.height);c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,z,z);res(c.toDataURL("image/jpeg",.85));};img.src=fr.result;};fr.readAsDataURL(file);});}

async function doLogin(){

 if((G.lock[k]||0)>now)return showErr(`Trop d'essais. Réessayez dans ${Math.ceil((G.lock[k]-now)/1000)} secondes.`);

 if(await pwdOk(i.value,s)){G.fails[k]=0;enterApp(s.id);return;}
 G.fails[k]=(G.fails[k]||0)+1;i.value="";i.focus();
 if(G.fails[k]>=5){G.fails[k]=0;G.lock[k]=now+30000;showErr("5 essais incorrects : ce profil est bloqué pendant 30 secondes.");}
 else showErr(`Mot de passe incorrect (essai ${G.fails[k]} sur 5).`);
}
