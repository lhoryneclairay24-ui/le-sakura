const actStat=a=>a.statut||"validee";
const actOk=()=>state.activites.filter(a=>actStat(a)==="validee");
function actSlot(a,full){const p=picto(apic(a)),col=pictoCol(apic(a)),res=(a.part||[]).map(id=>{const r=R(id);return r?(isNum(r)?r.nom:r.prenom):"";}).filter(Boolean);
 return `<button class="actc${full?" full":""}" style="--pc:${col}" data-act="act-open" data-id="${a.id}"><span class="actc-p" aria-hidden="true">${p.e}</span><span class="actc-b"><span class="actc-t num">${hm(a.debut)} – ${hm(a.fin)}</span><strong>${esc(a.titre)}</strong>
  <span class="actc-l">${a.lieu?`📍 ${esc(a.lieu)}`:""}${a.vehicule?` · 🚐 ${esc(a.vehicule)}`:""}</span>
  <span class="actc-l">${a.anim?`👤 ${esc(sname(a.anim))}`:""}${res.length?` · 👥 ${esc(res.join(", "))}`:""}</span>
  ${full&&a.materiel?`<span class="actc-l">🧰 ${esc(a.materiel)}</span>`:""}</span></button>`;}
function vAct(){
 const adm=isAdmin(),mon=ui.actWeek,days=[0,1,2,3,4,5,6].map(i=>addDays(mon,i));
 const props=state.activites.filter(a=>actStat(a)==="proposee").sort((a,b)=>(a.date+a.debut).localeCompare(b.date+b.debut));
 const mine=state.activites.filter(a=>a.propPar===state.me&&actStat(a)!=="validee").sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
 let body;
 if(ui.actDay){const d=ui.actDay,items=actOk().filter(a=>a.date===d).sort((a,b)=>a.debut.localeCompare(b.debut));
  const lanes=[];items.forEach(a=>{let l=lanes.findIndex(end=>end<=a.debut);if(l<0){l=lanes.length;lanes.push("");}lanes[l]=a.fin;a._l=l;});
  const H0=Math.min(8,...items.map(a=>+a.debut.slice(0,2))),H1=Math.max(19,...items.map(a=>+a.fin.slice(0,2)+(a.fin.slice(3)!=="00"?1:0))),ph=72,nl=Math.max(1,lanes.length);
  const y=t=>((+t.slice(0,2)-H0)*60+(+t.slice(3,5)))/60*ph;
  const hours=[];for(let h=H0;h<=H1;h++)hours.push(`<div class="tl-h" style="top:${(h-H0)*ph}px"><span>${h}h</span></div>`);
  body=`<div class="toolbar"><div class="datenav"><button class="btn" data-act="act-day" data-d="">${icon("left",18)} Retour à la semaine</button><button class="btn icon" data-act="act-day" data-d="${addDays(d,-1)}" aria-label="Jour précédent">${icon("left")}</button><strong>${esc(cap(fmtDay(d)))}</strong><button class="btn icon" data-act="act-day" data-d="${addDays(d,1)}" aria-label="Jour suivant">${icon("right")}</button></div></div>
   ${items.length?`<div class="tl" style="height:${(H1-H0)*ph+8}px">${hours.join("")}<div class="tl-area">${items.map(a=>`<div class="tl-b" style="top:${y(a.debut)}px;height:${Math.max(ph*.75,y(a.fin)-y(a.debut))}px;left:${a._l/nl*100}%;width:${100/nl}%">${actSlot(a,true)}</div>`).join("")}</div></div>`:`<p class="empty">Aucune activité ce jour-là.</p>`}`;}
 else{const cols=days.map(d=>{const items=actOk().filter(a=>a.date===d).sort((a,b)=>a.debut.localeCompare(b.debut));
   return `<section class="aday${d===TODAY?" is-today":""}${isWE(d)?" we":""}"><button class="aday-h" data-act="act-day" data-d="${d}" title="Voir la journée en grand"><span>${esc(cap(fmtDay(d,{weekday:"long"})))}</span><strong>${+d.slice(8)}</strong></button>${items.map(a=>actSlot(a)).join("")||`<p class="empty small">—</p>`}</section>`;}).join("");
  body=`<div class="toolbar"><div class="datenav"><button class="btn icon" data-act="act-week" data-n="-1" aria-label="Semaine précédente">${icon("left")}</button><button class="btn sm" data-act="act-week" data-n="0">Cette semaine</button><button class="btn icon" data-act="act-week" data-n="1" aria-label="Semaine suivante">${icon("right")}</button></div><span class="muted small">Touchez un jour pour le voir heure par heure.</span></div>
   <div class="aweek">${cols}</div>`;}
 const legend=`<div class="chips" style="margin:14px 0 0">${PICTO_CATS.map(c=>`<span class="pill" style="background:${c[2]};color:#fff">${esc(c[1])}</span>`).join("")}</div>`;
 return topbar("Planning d'activités",`Semaine du ${esc(fmtDay(mon,{day:"numeric",month:"long"}))} au ${esc(fmtDay(days[6],{day:"numeric",month:"long"}))}`,`<button class="btn primary" data-act="go" data-v="depot">${icon("plus",18)} ${adm?"Créer une activité":"Déposer une activité"}</button>`)+
  (adm&&props.length?`<section class="card" style="margin-bottom:16px;border-color:var(--warn)"><div class="card-h"><h2>${icon("info")} ${props.length} activité${props.length>1?"s":""} à valider</h2></div><div class="aprops">${props.map(a=>`<div class="aprop">${actSlot(a)}<div class="row"><span class="muted small">Déposée par ${esc(sname(a.propPar))}</span><button class="btn sm ok" data-act="act-ok" data-id="${a.id}">${icon("check",16)} Valider</button><button class="btn sm bad" data-act="act-no" data-id="${a.id}">Refuser</button></div></div>`).join("")}</div></section>`:"")+
  (!adm&&mine.length?`<section class="card" style="margin-bottom:16px"><div class="card-h"><h2>Mes activités déposées</h2></div>${mine.map(a=>`<div class="row-between" style="padding:6px 0;border-top:1px solid var(--line)"><span>${picto(apic(a)).e} <strong>${esc(a.titre)}</strong> · ${esc(fmtDay(a.date,{day:"numeric",month:"long"}))}</span>${actStat(a)==="proposee"?`<span class="pill warn">En attente de validation</span>`:`<span class="pill bad" title="${esc(a.motifRefus||"")}">Refusée${a.motifRefus?" : "+esc(a.motifRefus):""}</span>`}</div>`).join("")}</section>`:"")+
  body+legend;
}
function actOpen(id){

function cmdCard(c){const adm=isAdmin(),st=CMD_ST[c.statut]||CMD_ST.demandee;

const isMed=()=>{const s=ST(state.me);return !!s&&(s.admin||roleOf(s)==="medical");};
const onlyMed=()=>toast("Réservé au corps médical et à la direction.");
const LST=k=>state[k]||(state[k]=[]);
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(",","."));return isNaN(n)?null:n;};
/* Poids et constantes */
const constOf=rid=>LST("constantes").filter(c=>c.rid===rid).sort((a,b)=>(b.date+b.h).localeCompare(a.date+a.h));
const lastVal=(rid,k)=>{const c=constOf(rid).find(x=>x[k]!==""&&x[k]!=null);return c?{v:c[k],date:c.date,h:c.h}:null;};
const poidsAlert=r=>{const p=lastVal(r.id,"poids");if(!p)return "";const v=num(p.v),mn=num(r.poidsMin),mx=num(r.poidsMax);if(v==null)return "";if(mn!=null&&v<mn)return "bas";if(mx!=null&&v>mx)return "haut";return "";};
const constAlerts=()=>state.residents.filter(r=>poidsAlert(r));
function spark(rid){const pts=constOf(rid).filter(c=>num(c.poids)!=null).slice(0,10).reverse();if(pts.length<2)return "";
 const vs=pts.map(c=>num(c.poids)),mn=Math.min(...vs),mx=Math.max(...vs),w=150,h=40,rg=(mx-mn)||1;
 const xy=vs.map((v,i)=>`${(i/(vs.length-1)*w).toFixed(1)},${(h-4-(v-mn)/rg*(h-8)).toFixed(1)}`).join(" ");
 return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Évolution du poids : de ${vs[0]} à ${vs[vs.length-1]} kg"><polyline points="${xy}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;}
function vConst(){
 const med=isMed();
 const cards=resSorted().map(r=>{const p=lastVal(r.id,"poids"),al=poidsAlert(r),L=k=>{const x=lastVal(r.id,k);return x?`${esc(x.v)}`:"—";};
  const rng=(r.poidsMin||r.poidsMax)?`Seuils : ${r.poidsMin?esc(r.poidsMin):"…"} – ${r.poidsMax?esc(r.poidsMax):"…"} kg`:"Aucun seuil fixé";
  return `<article class="card${al?" alert-card":""}"><div class="row-between"><div class="who">${avatar(r)}<div><strong>${esc(rname(r))}</strong><span class="muted small">${rng}</span></div></div>${al?`<span class="pill bad">Poids trop ${al}</span>`:""}</div>
   <div class="cst-top"><div><span class="cst-big num">${p?esc(p.v)+" kg":"—"}</span><span class="muted small">${p?"le "+esc(fmtDay(p.date,{day:"numeric",month:"long"})):"Pas encore pesé(e)"}</span></div>${spark(r.id)}</div>
   <div class="cst-grid"><span><small>Tension</small><strong>${L("ta")}</strong></span><span><small>Pouls</small><strong>${L("pouls")}</strong></span><span><small>Température</small><strong>${L("temp")}</strong></span><span><small>Saturation</small><strong>${L("spo2")}</strong></span><span><small>Glycémie</small><strong>${L("glyc")}</strong></span></div>
   <div class="row" style="margin-top:10px">${med?`<button class="btn sm primary" data-act="cst-new" data-r="${r.id}">${icon("plus",16)} Saisir</button><button class="btn sm" data-act="cst-seuil" data-r="${r.id}">Seuils de poids</button>`:""}<button class="btn sm ghost" data-act="cst-hist" data-r="${r.id}">Historique</button></div></article>`;}).join("");
 return topbar("Poids et constantes",med?"Saisie réservée au corps médical et à la direction":"En consultation : la saisie est faite par le corps médical")+

function rappels(){
 const me=ST(state.me);if(!me)return [];const adm=!!me.admin,lim=isLimited(),out=[],add=(lvl,txt,v,ic)=>out.push({lvl,txt,v,ic:ic||"info"});
 const now=new Date(),H=now.getHours(),tom=addDays(TODAY,1);
 // Demandes qui traînent (techniciens, ouvriers, médical, direction)
 const old=LST("transmissions").filter(t=>DEST.includes(t.kind)&&t.statut==="afaire"&&trCanDo(t.kind)&&daysBetween(t.dt.slice(0,10),TODAY)>=2);
 if(old.length)add("warn",`${old.length} demande${old.length>1?"s":""} « à faire » depuis plus de 2 jours`,"transmissions","repair");
 if(lim)return out;
 // Transmissions importantes non lues
 const un=unreadImp().length;if(un)add("bad",`${un} transmission${un>1?"s":""} importante${un>1?"s":""} à lire`,"transmissions","note");
 // Demain : rendez-vous et activités où je suis attendu(e)
 LST("agenda").filter(a=>a.date===tom&&(a.staff||[]).includes(state.me)).forEach(a=>add("info",`Demain ${hm(a.debut)} : ${a.titre}${(a.residents||[]).length?" avec "+a.residents.map(id=>rname(R(id))).join(", "):""}${a.vehicule?" · "+a.vehicule:""}${a.notes?" · "+a.notes:""}`,adm?"agenda":"aujourdhui","agenda"));
 actOk().filter(a=>a.date===tom&&(a.anim===state.me||(a.staff||[]).includes(state.me))).forEach(a=>add("info",`Demain ${hm(a.debut)} : ${a.titre}${a.materiel?" · matériel : "+a.materiel:""}`,"activites","cal"));
 // Médicaments en retard aujourd'hui
 const lateM={matin:10,midi:14,soir:21,coucher:23};let lm=0;
 activePresc(TODAY).filter(p=>!p.sb&&!isAway(p.rid,TODAY)).forEach(p=>(p.moments||[]).forEach(m=>{if(H>=lateM[m]&&!state.admin[akey(TODAY,p.id,m)])lm++;}));
 if(lm)add("bad",`${lm} prise${lm>1?"s":""} de médicaments non cochée${lm>1?"s":""} aujourd'hui`,"medicaments","pill");
 // Rondes de nuit non notées (pendant la nuit)
 if(H>=21||H<8){const night=nightDefault(),nowKey=`${TODAY}T${pad(H)}`;let lr=0;
  resSorted().filter(r=>!isAway(r.id,night)).forEach(r=>rondesOf(r).forEach(h=>{if(!rondeAt(night,r.id,h)&&`${nDate(night,h)}T${h}`<nowKey)lr++;}));
  if(lr)add("bad",`${lr} ronde${lr>1?"s":""} de nuit non notée${lr>1?"s":""}`,"nuit","clock");}
 // Projets dont je suis référent
 if(!adm){const pr=ppRevSoon().filter(p=>{const r=R(p.rid);return r&&r.referent===state.me;});if(pr.length)add("warn",`${pr.length} projet${pr.length>1?"s":""} personnalisé${pr.length>1?"s":""} à réviser bientôt`,"projets","users");}
 if(isMed()){const ca=constAlerts().length,sa=stockAlerts().length;if(ca)add("warn",`${ca} poids en dehors des seuils`,"constantes","steth");if(sa)add("warn",`${sa} médicament${sa>1?"s":""} à surveiller dans le stock`,"stock","shield");}
 if(adm){
  const n=(k,txt,v,ic,lvl)=>{const c=typeof k==="number"?k:navBadge(k);if(c)add(lvl||"warn",txt(c),v,ic);};
  n("conges",c=>`${c} demande${c>1?"s":""} de congé ou d'horaire à traiter`,"conges","sun");
  n("commandes",c=>`${c} commande${c>1?"s":""} à valider`,"commandes","cart");
  n("activites",c=>`${c} activité${c>1?"s":""} déposée${c>1?"s":""} à valider`,"activites","cal");
  n(ppToVal().length,c=>`${c} projet${c>1?"s":""} personnalisé${c>1?"s":""} à valider`,"projets","users");
  n(ppRevSoon().length,c=>`${c} projet${c>1?"s":""} personnalisé${c>1?"s":""} à réviser dans moins de 30 jours`,"projets","users");
  n("contention",c=>`${c} contention${c>1?"s":""} à surveiller ou réévaluer`,"contention","shield","bad");
  const nm=nextMonth(monthOf(TODAY)),pd=pubDate(nm),dd=daysBetween(TODAY,pd);if(dd>=0&&dd<=3)add("info",`Le planning de ${monthName(nm)} devient visible pour l'équipe le ${dShort(pd)} : vérifiez-le`,"horaires","clock");
  const ld=lockDate(nm),dl=daysBetween(TODAY,ld);if(dl>=0&&dl<=2&&planPhase(nm)==="open")add("info",`Le planning de ${monthName(nm)} devient définitif après le ${dShort(ld)}`,"horaires","clock");
  LST("agenda").filter(a=>a.date===tom&&!(a.staff||[]).includes(state.me)).forEach(a=>add("info",`Demain ${hm(a.debut)} : ${a.titre}`,"agenda","agenda"));
 }
 return out;
}

const J_COL={transmissions:"Transmission",contentions:"Fiche de contention",sanctions:"Mesure éducative",retours:"Retour en famille",crs:"Compte rendu médical",residents:"Dossier résident",staff:"Profil",demandes:"Demande (congé, horaire)",activites:"Activité",agenda:"Agenda",commandes:"Commande",constantes:"Poids et constantes",repas:"Repas",hydra:"Hydratation",stock:"Stock de médicaments",projets:"Projet personnalisé",ppObs:"Observation de projet",rondes:"Ronde de nuit",nuitEv:"Événement de nuit",selles:"Selles",prescriptions:"Traitement",sbPrises:"Prise si besoin",posts:"Information de la direction",messages:"Message"};
const J_OBJ={shifts:"Planning des horaires",admin:"Prise de médicament",menus:"Menus"};
const J_A={crea:["Création","ok"],modif:["Modification","info"],supp:["Suppression","bad"],consult:["Consultation",""]};
let jPrev=null;
const jSnap=()=>{const o={};Object.keys(J_COL).concat(Object.keys(J_OBJ)).forEach(k=>{if(state[k]!==undefined)o[k]=JSON.stringify(state[k]);});return o;};
const jName=(k,x)=>{if(!x||typeof x!=="object")return "";if(k==="staff")return `${x.prenom||""} ${x.nom||""}`.trim();if(k==="residents")return rname(x);const r=x.rid?R(x.rid):null;const t=x.titre||x.objet||x.article||x.nom||x.type||(x.texte?String(x.texte).slice(0,50):"");return [r?rname(r):"",t].filter(Boolean).join(" · ");};
function logJ(a,c,x){const me=ST(state.me);if(!me)return;const l=state.journal||(state.journal=[]);l.push({id:"j"+uid(),t:`${TODAY}T${nowHM()}`,w:state.me,a,c,x:x||""});if(l.length>5000)l.splice(0,l.length-5000);}
function jDiff(){if(!jPrev){jPrev=jSnap();return;}const cur=jSnap();
 Object.keys(J_COL).forEach(k=>{if(cur[k]===jPrev[k])return;let A0=[],B0=[];try{A0=JSON.parse(jPrev[k]||"[]")||[];B0=JSON.parse(cur[k]||"[]")||[];}catch(e){return;}if(!Array.isArray(A0)||!Array.isArray(B0))return;
  const ma=new Map(A0.filter(x=>x&&x.id).map(x=>[x.id,x])),mb=new Map(B0.filter(x=>x&&x.id).map(x=>[x.id,x]));
  mb.forEach((x,id)=>{if(!ma.has(id))logJ("crea",J_COL[k],jName(k,x));else if(JSON.stringify(ma.get(id))!==JSON.stringify(x)){const y=ma.get(id),ch=Object.keys(Object.assign({},x,y)).filter(f=>JSON.stringify(x[f])!==JSON.stringify(y[f])&&!["hash","salt","lus","modifLe","modifPar"].includes(f));if(k==="staff"&&x.hash!==y.hash)ch.push("mot de passe");if(ch.length||k!=="transmissions")logJ("modif",J_COL[k],jName(k,x)+(ch.length?` (${ch.join(", ")})`:""));}});
  ma.forEach((x,id)=>{if(!mb.has(id))logJ("supp",J_COL[k],jName(k,x));});});
 Object.keys(J_OBJ).forEach(k=>{if(cur[k]!==jPrev[k]&&jPrev[k]!==undefined){let a={},b={};try{a=JSON.parse(jPrev[k])||{};b=JSON.parse(cur[k])||{};}catch(e){}const ch=Object.keys(Object.assign({},a,b)).filter(f=>JSON.stringify(a[f])!==JSON.stringify(b[f]));
  if(!ch.length)return;let det=`${ch.length} élément${ch.length>1?"s":""}`;if(k==="shifts")det=ch.slice(0,4).map(f=>{const [d,sid]=f.split("|");return `${sname(sid)} le ${fmtDay(d,{day:"numeric",month:"short"})} : ${b[f]||"vide"}`;}).join(" ; ")+(ch.length>4?` … (${ch.length} cases)`:"");
  if(k==="admin")det=ch.slice(0,3).map(f=>{const [d,pid,m]=f.split("|"),p=LST("prescriptions").find(x=>x.id===pid);return p?`${rname(R(p.rid))} · ${p.nom} (${MOMENTS[m]?MOMENTS[m].label.toLowerCase():m})${b[f]?"":" annulée"}`:f;}).join(" ; ");
  if(k==="menus")det=ch.map(f=>fmtDay(f,{day:"numeric",month:"short"})).join(", ");
  logJ("modif",J_OBJ[k],det);}});
 jPrev=jSnap();}

/* ---------- Partage en ligne (base de données de l'artifact) ---------- */
var syncDb=null,syncBase={},syncRemote={},syncChunks={},syncTimer=null,syncBusy=false,syncAgain=false,syncReady=false,syncPendingRemote=null,syncRO=false,syncStatus="local";
var SYNC_COL="sakura",SYNC_SKIP=["me"],SYNC_CHUNK=90000;
const cloneJ=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
const sameJ=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const isPlainObj=o=>!!o&&typeof o==="object"&&!Array.isArray(o);
function syncPill(){const m={local:["","Sur cet appareil uniquement"],connecting:["warn","Connexion…"],ok:["ok","Partagé en ligne"],saving:["info","Enregistrement…"],ro:["warn","Lecture seule"],err:["bad","Hors connexion"]}[syncStatus]||["",""];return `<span id="syncpill" class="pill ${m[0]} syncpill" title="État du partage des données">${esc(m[1])}</span>`;}
function setSync(s){syncStatus=s;const el=$("syncpill");if(el)el.outerHTML=syncPill();}
function merge3(base,local,remote){
 if(remote===undefined||sameJ(remote,base))return local;
 if(sameJ(local,base))return remote;
 if(isPlainObj(local)&&isPlainObj(remote)){const b=isPlainObj(base)?base:{},out={};
  new Set([...Object.keys(remote),...Object.keys(local),...Object.keys(b)]).forEach(k=>{const inL=k in local,inR=k in remote,inB=k in b;
   if(inB&&!inL&&(!inR||sameJ(remote[k],b[k])))return;
   if(inB&&!inR&&(!inL||sameJ(local[k],b[k])))return;
   if(!inL){out[k]=remote[k];return;}
   if(!inR){out[k]=local[k];return;}
   out[k]=merge3(inB?b[k]:undefined,local[k],remote[k]);});
  return out;}
 if(Array.isArray(local)&&Array.isArray(remote)&&[...local,...remote].every(x=>isPlainObj(x)&&"id" in x)){
  const bm=new Map((Array.isArray(base)?base:[]).filter(x=>isPlainObj(x)&&"id" in x).map(x=>[x.id,x])),lm=new Map(local.map(x=>[x.id,x])),seen=new Set(),out=[];
  remote.forEach(r=>{seen.add(r.id);const b=bm.get(r.id),l=lm.get(r.id);if(!l){if(b&&sameJ(r,b))return;out.push(r);return;}out.push(merge3(b,l,r));});
  local.forEach(l=>{if(seen.has(l.id))return;const b=bm.get(l.id);if(b&&sameJ(l,b))return;out.push(l);});
  return out;}
 return local;
}
async function writeKey(k){
 const json=JSON.stringify(state[k]===undefined?null:state[k]),rev=uid(),n=Math.max(1,Math.ceil(json.length/SYNC_CHUNK)),col=syncDb.collection(SYNC_COL);
 for(let i=n-1;i>=0;i--)await col.doc(i?`${k}__${i}`:k).set({k,i,n,rev,s:json.slice(i*SYNC_CHUNK,(i+1)*SYNC_CHUNK)});
 for(let i=n;i<(syncChunks[k]||1);i++){try{await col.doc(`${k}__${i}`).delete();}catch(e){}}
 syncChunks[k]=n;
}
function scheduleSync(){if(!syncDb||!syncReady||syncRO)return;clearTimeout(syncTimer);syncTimer=setTimeout(flushSync,500);}
async function flushSync(){
 if(syncBusy){syncAgain=true;return;}
 syncBusy=true;let wrote=false,changedLocal=false;
 try{
  for(const k of Object.keys(state)){
   if(SYNC_SKIP.includes(k)||sameJ(state[k],syncBase[k]))continue;
   if(!wrote){setSync("saving");wrote=true;}
   const merged=merge3(syncBase[k],state[k],syncRemote[k]);
   if(!sameJ(merged,state[k])){state[k]=merged;changedLocal=true;}
   await writeKey(k);syncBase[k]=cloneJ(merged);syncRemote[k]=cloneJ(merged);
  }
  setSync("ok");
 }catch(e){const c=e&&e.code;
  if(c==="invalid_argument"){syncRO=true;setSync("ro");toast("Vous ne pouvez pas modifier les données partagées : demandez à la direction l'accès « Contributeur ».");}
  else if(c==="quota_exceeded"){setSync("err");toast("L'espace de stockage partagé est plein.");}
  else{setSync("err");setTimeout(scheduleSync,5000);}
 }
 syncBusy=false;
 try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
 if(changedLocal&&!$("modal-root").innerHTML)refreshUI();
 if(syncAgain){syncAgain=false;scheduleSync();}
}
function decodeRemote(snap){
 const groups={},out={};
 snap.docs.forEach(d=>{const b=d.data();if(b&&typeof b.k==="string")(groups[b.k]=groups[b.k]||[]).push(b);});
 Object.keys(groups).forEach(k=>{const parts=groups[k],head=parts.find(p=>p.i===0);if(!head)return;const ps=[];
  for(let i=0;i<head.n;i++){const p=parts.find(x=>x.i===i&&x.rev===head.rev);if(!p)return;ps.push(p.s);}
  try{out[k]=JSON.parse(ps.join(""));syncChunks[k]=Math.max(syncChunks[k]||1,parts.length);}catch(e){}});
 return out;
}
function refreshUI(){
 applyShiftDefs();
 if(session&&!ST(session)){logout();return;}
 if(!$("gate").hidden){if(G.view==="setup"&&admins().length)G.view="profiles";if(["profiles","setup","manage"].includes(G.view))renderGate();return;}
 render();
}
function applyRemoteAll(remote,first){
 if(!first&&$("modal-root").innerHTML){syncPendingRemote=remote;return;}
 let changed=first,pending=false;
 Object.keys(remote).forEach(k=>{if(SYNC_SKIP.includes(k))return;const r=remote[k];syncRemote[k]=cloneJ(r);
  if(first||sameJ(state[k],syncBase[k])){if(!sameJ(state[k],r)){state[k]=cloneJ(r);changed=true;}syncBase[k]=cloneJ(r);}
  else pending=true;});
 if(first){const before=JSON.stringify(state);migrate();if(JSON.stringify(state)!==before)pending=true;}
 if(changed){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}refreshUI();}
 if(pending||first)scheduleSync();
}
async function startSync(){
 let db=null;
 try{if(window.claude&&typeof window.claude.use==="function")db=await window.claude.use("db");}catch(e){}
 if(!db){setSync("local");return;}
 syncDb=db;setSync("connecting");
 try{const u=await window.claude.use("user");if(u&&typeof u.can==="function"){const w=await u.can("data.write");if(w===false)syncRO=true;}}catch(e){}
 const timer=setTimeout(()=>{if(!syncReady)setSync("err");},10000);
 db.collection(SYNC_COL).onSnapshot(snap=>{
  if(!syncReady){
   if(snap.metadata&&snap.metadata.fromCache)return;
   clearTimeout(timer);syncReady=true;
   const remote=decodeRemote(snap);
   if(!Object.keys(remote).length){syncBase={};syncRemote={};setSync(syncRO?"ro":"ok");scheduleSync();return;}
   applyRemoteAll(remote,true);setSync(syncRO?"ro":"ok");return;
  }
  applyRemoteAll(decodeRemote(snap),false);
 },err=>{clearTimeout(timer);setSync("err");});
}

/* ---------- Sauvegarde des données ---------- */
let dlNs=null;
try{if(window.claude&&typeof window.claude.use==="function")window.claude.use("downloads").then(n=>{dlNs=n;},()=>{});}catch(e){}
function dataBackup(){
 if(!isAdmin())return;
 const payload=JSON.stringify({app:"Le Sakura",version:state.v,exportedAt:new Date().toISOString(),data:state});
 const size=Math.max(1,Math.round(payload.length/1024));
 openModal("Sauvegarder les données",`<div class="stack">
  <section class="cfs"><h3><span class="cfn">1</span> Exporter</h3>
   <p class="small">Toutes les saisies de cet appareil : profils et mots de passe (chiffrés), résidents, médicaments, selles, contentions, transmissions, agenda… (${size} Ko).</p>
   <div class="row"><button type="button" class="btn primary" id="bk-copy">Copier les données</button><button type="button" class="btn" id="bk-dl">Télécharger le fichier</button></div>
   <textarea id="bk-out" rows="3" readonly aria-label="Données exportées">${esc(payload)}</textarea>
   <p class="hint">Collez le texte copié dans un document ou un e-mail que vous gardez en lieu sûr. Le téléchargement fonctionne quand l'application est ouverte depuis votre ordinateur.</p></section>
  <section class="cfs"><h3><span class="cfn">2</span> Restaurer</h3>
   <p class="small">Remplace toutes les données de cet appareil par une sauvegarde. Utile pour retrouver vos données ou les mettre sur un autre appareil.</p>
   <textarea id="bk-in" rows="3" placeholder="Collez ici le texte d'une sauvegarde" aria-label="Texte de sauvegarde à restaurer"></textarea>
   <div class="row"><label class="btn" for="bk-file">Choisir un fichier de sauvegarde</label><input type="file" id="bk-file" accept=".json,.txt,application/json,text/plain" class="sr"><button type="button" class="btn bad" id="bk-restore">Restaurer</button></div>
   <p class="mnote" id="bk-msg" role="alert"></p></section>
  <p class="hint">Cette sauvegarde contient des informations sur les résidents : gardez-la en lieu sûr et ne la partagez pas.</p></div>`,true);
 const mark=()=>{state.lastExport=TODAY;save();};
 $("bk-copy").addEventListener("click",()=>{
  const fallback=()=>{const t=$("bk-out");t.focus();t.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}if(ok){mark();toast("Données copiées");}else toast("Le texte est sélectionné : faites Ctrl+C (ou Copier) pour le copier.");};
  try{navigator.clipboard.writeText(payload).then(()=>{mark();toast("Données copiées");},fallback);}catch(e){fallback();}
 });
 $("bk-dl").addEventListener("click",()=>{
  const filename=`le-sakura-donnees-${TODAY}.json`;
  const local=()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([payload],{type:"application/json"}));a.download=filename;document.body.appendChild(a);a.click();a.remove();mark();toast("Téléchargement lancé. S'il ne démarre pas, utilisez « Copier les données ».");}catch(e){toast("Téléchargement impossible ici : utilisez « Copier les données ».");}};
  if(!dlNs)return local();
  dlNs.save({filename,data:payload}).then(()=>{mark();toast("Fichier de sauvegarde enregistré");},err=>{
   const c=err&&err.code;
   if(c==="declined")toast("Téléchargement annulé");
   else if(c==="rate_limited")toast("Une fenêtre de téléchargement est déjà ouverte.");
   else toast("Téléchargement impossible ici : utilisez « Copier les données ».");
  });
 });
 $("bk-file").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{$("bk-in").value=String(fr.result||"");$("bk-msg").textContent="Fichier chargé. Touchez « Restaurer ».";};fr.readAsText(f);});
 const rb=$("bk-restore");
 rb.addEventListener("click",()=>{
  const msg=$("bk-msg");let obj;
  try{obj=JSON.parse($("bk-in").value.trim());}catch(e){msg.textContent="Ce texte n'est pas une sauvegarde valide. Vérifiez qu'il a été copié en entier.";return;}
  const d=obj&&obj.data?obj.data:obj;
  if(!d||!Array.isArray(d.staff)||!Array.isArray(d.residents)){msg.textContent="Ce texte n'est pas une sauvegarde de l'application Le Sakura.";return;}
  if(!d.staff.some(s=>s.admin&&s.hash)){msg.textContent="Cette sauvegarde ne contient aucun compte administrateur : restauration annulée.";return;}
  if(!rb.dataset.armed){rb.dataset.armed="1";rb.textContent="Confirmer : remplacer toutes les données";msg.textContent=`Sauvegarde du ${obj.exportedAt?new Date(obj.exportedAt).toLocaleDateString("fr-FR"):"(date inconnue)"} : ${d.residents.length} résidents, ${d.staff.length} profils. Touchez à nouveau pour confirmer.`;return;}
  const meKeep=state.me;state=d;state.me=meKeep;migrate();save();closeModal();
  if(session&&!ST(session))logout();else render();
  toast(syncDb?"Données restaurées et partagées avec l'équipe":"Données restaurées");
 });
}
$("gate").addEventListener("change",e=>{
 if(e.target.id!=="g-lockmin")return;

 const p=$("gate").querySelector(".gate-ok");const msg=state.lockMin?`Verrouillage automatique réglé sur ${e.target.selectedOptions[0].textContent}.`:"Verrouillage automatique désactivé.";

/* ---------- Démarrage ---------- */
const h0=location.hash.slice(1);
if(VIEW_FN[h0])ui.view=h0;
let storedAct=0;try{storedAct=+sessionStorage.getItem(AKEY)||0;}catch(e){}
if(!admins().length)showGate("setup");
else if(session&&ST(session)&&ST(session).hash){
 if(storedAct&&idleTooLong(storedAct)){const id=session;session=id;lockNow("Session verrouillée après une période d'inactivité.");}
 else enterApp(session);
}
else showGate("profiles");
startSync();
})();
