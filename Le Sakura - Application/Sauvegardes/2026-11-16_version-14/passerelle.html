<title>Le Sakura carnet d'équipe</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600&display=swap">
<style>
/* Layout : coque d'application — navigation latérale sur PC, barre d'onglets en bas sur téléphone ; contenu en cartes de travail lisibles (police Atkinson Hyperlegible, pensée pour la basse vision) */
:root{
  --bg:#fbf6f1; --surface:#ffffff; --surface-2:#f5eaea; --line:#ead9da; --fg:#2c1824; --muted:#715a67;
  --accent:#8b3d62; --accent-fg:#ffffff; --accent-soft:#f7e0e9;
  --ok:#1b7443; --ok-soft:#d9f0e1; --warn:#8c5300; --warn-soft:#fbead0; --bad:#ae2a20; --bad-soft:#f8dedb;
  --info:#2a5592; --info-soft:#dde7f6; --night:#4b3f8f; --night-soft:#e6e2f6;
  --scrim:rgba(12,24,26,.5); --shadow:0 12px 32px rgba(12,24,26,.18);
  --font-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Lexend","Atkinson Hyperlegible",system-ui,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191115; --surface:#231920; --surface-2:#2e2229; --line:#45333c; --fg:#f5e9ee; --muted:#bfa8b4;
    --accent:#f0a6c1; --accent-fg:#2b0f1d; --accent-soft:#4b2537;
    --ok:#6dd197; --ok-soft:#163623; --warn:#efb25a; --warn-soft:#3a2a10; --bad:#f2968d; --bad-soft:#41201d;
    --info:#94b6ef; --info-soft:#1b2c47; --night:#b9aef5; --night-soft:#2a2550;
    --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191115; --surface:#231920; --surface-2:#2e2229; --line:#45333c; --fg:#f5e9ee; --muted:#bfa8b4;
  --accent:#f0a6c1; --accent-fg:#2b0f1d; --accent-soft:#4b2537;
  --ok:#6dd197; --ok-soft:#163623; --warn:#efb25a; --warn-soft:#3a2a10; --bad:#f2968d; --bad-soft:#41201d;
  --info:#94b6ef; --info-soft:#1b2c47; --night:#b9aef5; --night-soft:#2a2550;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* Coque */
.app{min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding-block:20px;padding-right:12px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 18px}
.brand svg{flex:none}
.brand strong{font-family:var(--font-display);font-size:19px;font-weight:600;display:block;line-height:1.1}
.brand span{font-size:13px;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:8px 12px;border:0;border-radius:10px;background:none;text-align:left;cursor:pointer;font-size:15px}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav-btn .badge{margin-left:auto}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--bad);color:var(--surface);font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.side-foot{margin-top:auto;padding:16px 8px 0;display:grid;gap:10px;font-size:13px;color:var(--muted)}
main{padding-block:24px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;max-width:1320px;width:100%;margin-inline:auto;display:block}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px 20px;margin-bottom:22px}
.topbar h1{font-size:28px}
.topbar .sub{color:var(--muted);margin-top:2px}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.me select{min-height:40px;width:auto}
/* Barre de navigation en haut */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding-block:6px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.nav-brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:17px;white-space:nowrap}
.nav-brand .brand-mark{width:40px;height:40px;border-radius:10px}
.tabs{flex:1;display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;max-width:1500px;margin-inline:auto}
.tab{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:4px 8px;border:0;background:none;border-radius:10px;font-size:14.5px;cursor:pointer;color:var(--muted);position:relative;min-width:0}
.tab svg{flex:none}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tab .l-short{display:none}
.tab:hover{background:var(--surface-2)}
.tab[aria-current="page"]{color:var(--accent);font-weight:700;background:var(--accent-soft)}
.tab .badge{position:absolute;top:2px;right:calc(50% - 24px);min-width:18px;height:18px;font-size:11px;padding:0 5px}
.tab{flex-direction:column;gap:2px;font-size:12px;min-height:54px;padding:4px 2px}
@media (max-width:1150px){
  .tabbar{position:static}
  .tabs{grid-template-columns:repeat(7,minmax(0,1fr))}
}

/* Accueil */
.posts{max-width:780px;display:grid;gap:14px}
.welcome{display:flex;gap:16px;align-items:center;background:var(--accent-soft);border-color:transparent}
.welcome img{width:64px;height:64px;border-radius:14px;flex:none;background:#fbf4e9}
.welcome h2{font-size:19px}
.post-t{font-size:19px;margin:8px 0 6px}

/* Médicaments : cases à cocher */
.medlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px;align-items:start}
.msub{font-family:var(--font-ui);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 4px}
.mline{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,62px);gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.mline-h{border-top:0;padding:0 0 2px}
.mline-h span{font-size:12px;color:var(--muted);text-align:center;font-weight:700}
.mline .nm,.sbrow .nm{min-width:0}
.mc{width:100%;min-height:46px;border-radius:10px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;font-size:11px;font-weight:700;cursor:pointer;border:0;background:none;color:var(--muted);font-variant-numeric:tabular-nums}
.mc.todo::before{content:"";width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;background:var(--surface)}
.mc.todo:hover{background:var(--surface-2)}
.mc.done{background:var(--ok-soft);color:var(--ok)}
.mc.no{background:var(--bad-soft);color:var(--bad)}
.mc.none{cursor:default;color:var(--line);font-size:18px}
.mc.wide{width:auto;flex-direction:row;gap:8px;padding:0 12px;font-size:13px}
.mc.todo.wide{border:1.5px dashed var(--line);color:var(--fg)}
.mc.todo.wide::before{width:20px;height:20px}
.mc.mini{width:26px;min-height:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;cursor:default}
.mc.mini.todo::before{width:16px;height:16px}
.legend-box{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.mnote{font-size:13px;color:var(--bad);margin:0 0 6px}
.sbrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.sb-do{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media (max-width:600px){
  .mline{grid-template-columns:minmax(0,1fr) repeat(4,46px);gap:3px}
  .mline-h span{font-size:10.5px}
}

/* Contention : tableau horaire */
.cs-table{min-width:1180px;font-size:14px}
.cs-table thead th{vertical-align:bottom;white-space:normal;min-width:86px;line-height:1.25}
.cs-table th:first-child{position:sticky;left:0;z-index:1;background:var(--surface);min-width:64px}
.cs-table td{white-space:nowrap}
.cs-table td.obs{white-space:normal;min-width:180px}
.cs-table tr.exp th:first-child{box-shadow:inset 4px 0 0 var(--accent);color:var(--accent);font-weight:700}
.cs-table tr.cur td,.cs-table tr.cur th{background:var(--info-soft)}
.cs-table tr.miss td{background:var(--warn-soft)}
.cs-table td.abn{background:var(--bad-soft);color:var(--bad);font-weight:700}
.cs-table tr.click{cursor:pointer}
.cs-table tr.click:hover td{filter:brightness(.97)}
.now{margin-bottom:16px;border-color:var(--accent)}
.nowlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.nowbtn{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;text-align:left;font:inherit}
.nowbtn span{display:grid}
.nowbtn small{opacity:.9}
.nowbtn.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.hlist{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.hrow:hover{background:var(--surface-2)}
.hrow .hh{font-family:var(--font-display);font-weight:600;font-size:18px}
.hrow.exp .hh{color:var(--accent)}
.hrow.cur{border-color:var(--info);box-shadow:inset 0 0 0 1px var(--info)}
.hrow.miss{background:var(--warn-soft);border-color:transparent}
.hb{display:grid;gap:4px;min-width:0}
.qtop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:14px}
.qf{display:grid;gap:6px;align-content:start;padding:10px;border-radius:12px;background:var(--surface-2);min-width:0}
.qf.full{grid-column:1/-1}
.qf .lbl{font-weight:700;font-size:14px}
.qf .qnum,.qta input{font-size:20px;min-height:52px;font-variant-numeric:tabular-nums}
.qta{display:flex;align-items:center;gap:8px}
.qta span{font-size:22px;color:var(--muted)}
.qf.abn{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad)}
.qf.abn .lbl{color:var(--bad)}
.rchip.alt input:checked+span{background:var(--bad);border-color:var(--bad);color:#fff}
.qsave{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);margin-bottom:-22px}
.qsave .spacer{margin-right:auto}
.cfs{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--surface-2)}
.cfs h3{font-size:16px;display:flex;gap:10px;align-items:center}
.cfn{width:28px;height:28px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:14px}
.cfs .rchip span{min-height:44px}
.cprow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.7fr) minmax(0,.8fr) minmax(0,1.5fr) auto;gap:6px;align-items:center;margin-bottom:8px}
@media (max-width:600px){.cprow{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding-bottom:8px;border-bottom:1px solid var(--line)}}

/* Agenda mensuel */
.cal{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-h{background:var(--surface-2)}
.cal-h div{padding:8px 4px;text-align:center;font-weight:700;color:var(--muted);font-size:13px}
.cell{min-height:118px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px 4px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;background:var(--surface)}
.cell:nth-child(7n+1){border-left:0}
.cell:hover{background:var(--surface-2)}
.cell.out .dn{color:var(--muted);opacity:.55}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.dn{align-self:center;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-size:15px;font-variant-numeric:tabular-nums}
.cell.sun .dn{color:var(--bad)}
.cell.today .dn{background:var(--fg);color:var(--bg);font-weight:700}
.chip{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:2px 7px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;min-height:22px}
.chip:hover{filter:brightness(1.08)}
.more{font-size:12px;color:var(--muted);padding-left:4px}
.dots{display:none;gap:3px;justify-content:center;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%}
.ev{display:flex;gap:14px;width:100%;text-align:left;border:0;background:none;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;color:inherit;border-radius:8px}
.ev:hover{background:var(--surface-2)}
.ev-t{min-width:52px;font-weight:700;display:grid;align-content:start;gap:2px}
.ev-b{display:grid;gap:4px;justify-items:start;min-width:0}
.srow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.srow input[type=color]{width:52px;flex:none;padding:4px;cursor:pointer}
@media (max-width:700px){
  .cell{min-height:58px;padding:4px 2px}
  .cell .chip,.cell .more{display:none}
  .dots{display:flex}
  .dn{width:26px;height:26px;font-size:14px}
}

/* Selles */
.notice.alert{background:var(--bad-soft);color:var(--bad)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:14px 0 10px}
.sday{display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--muted)}
.sday.is-today .sd-l{color:var(--accent);font-weight:700}
.sd-dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.sd-dot.ok{background:var(--ok-soft);color:var(--ok)} .sd-dot.warn{background:var(--warn-soft);color:var(--warn)} .sd-dot.bad{background:var(--bad-soft);color:var(--bad)}
.sd-dot.none{border:1.5px dashed var(--line)}
.poo{display:block;flex:none}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.scol{display:grid;gap:6px;align-content:start;background:var(--surface-2);border-radius:12px;padding:8px}
.scol h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.srec{display:grid;justify-items:center;gap:1px;padding:6px 4px;border-radius:10px;border:0;cursor:pointer;background:var(--surface);font:inherit;font-size:13px;font-weight:700;color:var(--fg)}
.srec small{font-size:11px;font-weight:400;color:var(--muted)}
.srec.ok{box-shadow:inset 0 0 0 2px var(--ok)} .srec.warn{box-shadow:inset 0 0 0 2px var(--warn)} .srec.bad{box-shadow:inset 0 0 0 2px var(--bad)}
.sadd{min-height:64px;border:1.5px dashed var(--muted);border-radius:10px;background:var(--surface);color:var(--muted);cursor:pointer;font:inherit;font-size:13px;font-weight:700}
.sadd.small{min-height:34px;background:none}
.sadd:hover{color:var(--accent);border-color:var(--accent)}
.sguide-box{margin-bottom:16px}
.sguide-box summary{cursor:pointer;font-weight:700;min-height:28px}
.sguide{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:12px}
.sg{display:grid;justify-items:center;text-align:center;gap:2px;padding:8px 6px;border-radius:10px;background:var(--surface-2);font-size:12px}
.sg span{color:var(--muted)}
.stiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.stile{display:grid;justify-items:center;text-align:center;gap:2px;padding:10px 6px;border:2px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);height:100%}
.stile b{font-size:14px}
.stile small{font-size:12px;color:var(--muted)}
.stile.ok b{color:var(--ok)} .stile.warn b{color:var(--warn)} .stile.bad b{color:var(--bad)}
.stile-wrap input:checked+.stile{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.stile-wrap input:focus-visible+.stile,.rchip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.rchips{display:flex;gap:6px;flex-wrap:wrap}
.rchip span{display:inline-flex;align-items:center;min-height:42px;padding:0 16px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;font-weight:700;background:var(--surface)}
.rchip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
@media (max-width:600px){.stiles{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Éléments */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:17px;display:flex;align-items:center;gap:8px}
.card-h h2 svg{color:var(--accent)}
.grid-dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.list{display:grid;gap:12px}
.stack{display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row-between{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:32px 0 14px}
.section-title h2{font-size:20px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.night{background:var(--night-soft);color:var(--night)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.icon{width:44px;padding:0}
.big{font-size:15px;color:var(--muted);margin-bottom:8px}

const hourOf=h=>parseInt(String(h||"0").slice(0,2),10)||0;
function inWin(c,hr){if(!c.debutH||!c.finH)return false;const s=hourOf(c.debutH),e=hourOf(c.finH),f=+c.freq||1;const w=s===e?true:s<=e?(hr>=s&&hr<e):(hr>=s||hr<e);return w&&((hr-s+24)%f===0);}
function cpAbn(p,val){
 if(val===""||val==null)return false;
 if(p.type==="num"){const n=parseFloat(String(val).replace(",","."));if(isNaN(n))return false;return (p.min!==""&&p.min!=null&&n<+p.min)||(p.max!==""&&p.max!=null&&n>+p.max);}
 if(p.type==="tension"){const m=/^(\d{2,3})\s*\/\s*(\d{2,3})/.exec(String(val));if(!m)return false;const sy=+m[1],di=+m[2];return sy>=160||sy<90||di>=100||di<50;}
 if(p.type==="choix")return (p.alertes||[]).includes(val);
 return false;
}
function missingHours(c,date){
 if(!c.debutH||!c.finH)return [];
 const lim=date<TODAY?24:date===TODAY?new Date().getHours():0;
 const out=[];for(let hr=0;hr<lim;hr++){if(inWin(c,hr)&&!c.surv.some(s=>s.date===date&&hourOf(s.h)===hr))out.push(hr);}
 return out;
}

   if(p.type==="num"){const m=/^\s*([\d.,]*)\s*-?\s*([\d.,]*)\s*$/.exec(ex);p.min=m&&m[1]?m[1].replace(",","."):"";p.max=m&&m[2]?m[2].replace(",","."):"";}
   if(p.type==="choix"){const vals=ex.split(",").map(s=>s.trim()).filter(Boolean);p.options=vals.map(s=>s.replace(/^\*\s*/,""));p.alertes=vals.filter(s=>s.startsWith("*")).map(s=>s.replace(/^\*\s*/,""));}

const sujet=id=>state.agSujets.find(s=>s.id===id)||{id:"autre",nom:"Autre",couleur:"#8a7f75"};
function textOn(hex){const h=(hex||"#888888").replace("#","");const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return (0.299*r+0.587*g+0.114*b)/255>0.62?"#1d1418":"#ffffff";}
const chipStyle=s=>`background:${s.couleur};color:${textOn(s.couleur)}`;
const agOfDay=d=>state.agenda.filter(a=>a.date===d).sort((a,b)=>(a.debut||"").localeCompare(b.debut||""));
const agWho=a=>[(a.residents||[]).length?"Résident : "+a.residents.map(id=>rname(R(id))).join(", "):"",(a.staff||[]).length?"Y va : "+a.staff.map(sname).join(", "):"",a.vehicule?"Véhicule : "+a.vehicule:"",a.lieu||""].filter(Boolean);
function vAgenda(){
 const adm=isAdmin(),m=ui.agMonth,first=m+"-01",start=mondayOf(first);
 const cells=[];for(let i=0;i<42;i++)cells.push(addDays(start,i));

function fieldHtml(f,val){
 const id="f-"+f.name,req=f.required?" required":"",star=f.required?" *":"";
 let input;
 if(f.type==="textarea")input=`<textarea id="${id}" name="${f.name}"${req}>${esc(val)}</textarea>`;
 else if(f.type==="select")input=`<select id="${id}" name="${f.name}"${req}>${f.options.map(([v,l])=>`<option value="${esc(v)}"${String(val==null?"":val)===String(v)?" selected":""}>${esc(l)}</option>`).join("")}</select>`;
 else if(f.type==="checks")return `<div class="field${f.full?" full":""}" data-f="${f.name}"><span class="lbl" id="${id}">${esc(f.label)}${star}</span><div class="checks" role="group" aria-labelledby="${id}">${f.options.map(([v,l])=>`<label class="check"><input type="checkbox" name="${f.name}" value="${esc(v)}"${(val||[]).includes(v)?" checked":""}> ${esc(l)}</label>`).join("")}</div>${f.hint?`<span class="hint">${esc(f.hint)}</span>`:""}</div>`;
 else if(f.type==="checkbox")return `<div class="field${f.full?" full":""}" data-f="${f.name}"><label class="check-inline" for="${id}"><input type="checkbox" id="${id}" name="${f.name}"${val?" checked":""}> ${esc(f.label)}</label></div>`;
 else input=`<input id="${id}" name="${f.name}" type="${f.type||"text"}" value="${esc(val)}"${req}>`;
 return `<div class="field${f.full?" full":""}" data-f="${f.name}"><label for="${id}">${esc(f.label)}${star}</label>${input}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:""}</div>`;
}
function openForm(o){

 openModal(o.title,`<form id="mform" class="form-grid" novalidate>${o.fields.map(f=>fieldHtml(f,v[f.name])).join("")}
  <div class="form-actions full">${o.onDelete?`<button type="button" class="btn bad spacer" id="mdel">${esc(o.deleteLabel||"Supprimer")}</button>`:""}<button type="button" class="btn" data-act="close">Annuler</button><button class="btn primary" type="submit">${esc(o.submit||"Enregistrer")}</button></div></form>`);
 const form=$("mform");
 form.addEventListener("submit",e=>{
  e.preventDefault();const x={};let ok=true;
  o.fields.forEach(f=>{
   const box=form.querySelector(`[data-f="${f.name}"]`);
   if(f.type==="checks")x[f.name]=[...form.querySelectorAll(`input[name="${f.name}"]:checked`)].map(i=>i.value);
   else if(f.type==="checkbox")x[f.name]=form.elements[f.name].checked;
   else x[f.name]=form.elements[f.name].value.trim();
   const empty=Array.isArray(x[f.name])?!x[f.name].length:!x[f.name];
   box.classList.toggle("err",!!(f.required&&empty));if(f.required&&empty)ok=false;
  });
  if(!ok){toast("Complétez les champs marqués d'un astérisque.");return;}
  if(o.onSubmit(x)===false)return;
  save();closeModal();render();
 });

let session=null;try{session=sessionStorage.getItem(SKEY);}catch(e){}

const HUES=["#b5562d","#6f8a34","#2f7c86","#8a4776","#b7832a","#4a69ab","#9c3f3a","#5b7d5e"];
const hueOf=s=>{let n=0;for(const c of String(s.id))n+=c.charCodeAt(0);return HUES[n%HUES.length];};
const ini=s=>initials(s);
const pav=(s,cls,photo)=>{const p=photo!==undefined?photo:s.photo;return `<span class="pav ${cls||""}" style="background:${hueOf(s)}" aria-hidden="true">${p?`<img src="${esc(p)}" alt="">`:esc(ini(s))}</span>`;};
async function hashPwd(pwd,salt){
 const data=new TextEncoder().encode(salt+":"+pwd);
 if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",data);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
 let h=5381;for(const c of data)h=((h<<5)+h+c)>>>0;return "f"+h.toString(16);
}
function readPhoto(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const z=256,c=document.createElement("canvas");c.width=c.height=z;const m=Math.min(img.width,img.height);c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,z,z);res(c.toDataURL("image/jpeg",.85));};img.src=fr.result;};fr.readAsDataURL(file);});}

  ${pwdField("g-apwd","Mot de passe administrateur","current-password")}${err}<button class="gate-btn solid" type="submit">Continuer</button><button class="gate-link" type="button" data-g="back">Retour</button></form>`;
 }else if(v==="manage"){
  h=`${brand}<h1>Gérer les profils</h1>${ok}<p class="gate-sub">Créez un profil pour chaque professionnel et donnez-lui son mot de passe. Un profil sans mot de passe n'apparaît pas sur l'écran de connexion.</p>
  <div class="mlist">${state.staff.map(s=>`<button class="mrow" data-g="edit" data-id="${s.id}">${pav(s,"sm")}<span class="mtxt"><strong>${esc(s.prenom+" "+s.nom)}</strong><span>${esc(s.fonction||"")}</span></span><span class="mtags">${s.admin?`<span class="gtag">Administrateur</span>`:""}${s.hash?`<span class="gtag ok">Actif</span>`:`<span class="gtag off">Sans mot de passe</span>`}</span></button>`).join("")}</div>

async function doLogin(){
 const s=ST(G.id),now=Date.now(),k=s.id;
 if((G.lock[k]||0)>now)return showErr(`Trop d'essais. Réessayez dans ${Math.ceil((G.lock[k]-now)/1000)} secondes.`);
 const i=$("g-pwd");
 if(await hashPwd(i.value,s.salt)===s.hash){G.fails[k]=0;enterApp(s.id);return;}
 G.fails[k]=(G.fails[k]||0)+1;i.value="";i.focus();
 if(G.fails[k]>=5){G.fails[k]=0;G.lock[k]=now+30000;showErr("5 essais incorrects : ce profil est bloqué pendant 30 secondes.");}
 else showErr(`Mot de passe incorrect (essai ${G.fails[k]} sur 5).`);
}
async function doAdmin(){
 const s=ST($("g-adm").value),now=Date.now(),k="admin";
 if((G.lock[k]||0)>now)return showErr(`Trop d'essais. Réessayez dans ${Math.ceil((G.lock[k]-now)/1000)} secondes.`);
 const i=$("g-apwd");
 if(s&&await hashPwd(i.value,s.salt)===s.hash){
  G.fails[k]=0;G.adminOK=true;G.msg="";G.ok="";
  if(G.after==="new"){G.editId=null;G.photo=undefined;G.view="edit";}else G.view="manage";
  renderGate();return;
 }
 G.fails[k]=(G.fails[k]||0)+1;i.value="";i.focus();
 if(G.fails[k]>=5){G.fails[k]=0;G.lock[k]=now+30000;showErr("5 essais incorrects : accès bloqué pendant 30 secondes.");}
 else showErr(`Mot de passe incorrect (essai ${G.fails[k]} sur 5).`);
}
async function doSetup(){
 const pre=$("g-pre").value.trim(),nom=$("g-nom").value.trim(),fct=$("g-fct").value.trim(),p1=$("g-p1").value,p2=$("g-p2").value;
 if(!pre||!nom)return showErr("Indiquez votre prénom et votre nom.");
 const e=pwdCheck(p1,p2,true);if(e)return showErr(e);
 const s={id:"s"+uid(),prenom:pre,nom,fonction:fct||"Direction",admin:true,salt:uid()+uid()};
 s.hash=await hashPwd(p1,s.salt);state.staff.unshift(s);save();
 G.adminOK=true;G.msg="";G.ok="Votre compte administrateur est créé. Ajoutez maintenant les profils de l'équipe, ou donnez un mot de passe aux profils d'exemple.";
 G.view="manage";renderGate();
}
async function doEdit(){
 const s=G.editId?ST(G.editId):null;
 const pre=$("g-pre").value.trim(),nom=$("g-nom").value.trim(),fct=$("g-fct").value.trim(),adm=$("g-isadm").checked,p1=$("g-p1").value,p2=$("g-p2").value;
 if(!pre||!nom)return showErr("Indiquez le prénom et le nom.");
 const e=pwdCheck(p1,p2,!(s&&s.hash));if(e)return showErr(e);
 if(s&&s.admin&&!adm&&admins().length<=1&&s.hash)return showErr("Gardez au moins un administrateur, sinon plus personne ne pourra gérer les profils.");
 const t=s||{id:"s"+uid()};
 Object.assign(t,{prenom:pre,nom,fonction:fct,admin:adm});
 if(G.photo!==undefined)t.photo=G.photo;
 if(p1){t.salt=uid()+uid();t.hash=await hashPwd(p1,t.salt);}
 if(!s)state.staff.push(t);
 save();G.msg="";G.ok=s?`Profil de ${pre} enregistré.`:`Profil de ${pre} créé. Communiquez-lui son mot de passe en main propre.`;G.view="manage";renderGate();
}
$("gate").addEventListener("click",e=>{
 const b=e.target.closest("[data-g]");if(!b)return;
 const a=b.dataset.g;
 if(a==="eye"){const i=$(b.dataset.for);const show=i.type==="password";i.type=show?"text":"password";b.textContent=show?"Masquer":"Afficher";return;}
 if(a==="nophoto"){G.photo="";$("g-prev").innerHTML=pav(editTmp(),"md","");b.hidden=true;return;}
 if(a==="del"){
  const s=ST(G.editId);
  if(s.admin&&s.hash&&admins().length<=1)return showErr("Impossible de supprimer le dernier administrateur.");
  if(!b.dataset.armed){b.dataset.armed="1";b.textContent=`Confirmer la suppression du profil de ${s.prenom}`;return;}
  state.staff=state.staff.filter(x=>x.id!==s.id);save();G.msg="";G.ok=`Profil de ${s.prenom} supprimé.`;G.view="manage";renderGate();return;
 }
 G.msg="";
 if(a==="pick"){G.id=b.dataset.id;G.note="";G.view="login";}
 else if(a==="back"){G.note="";G.view="profiles";}
 else if(a==="add"){G.ok="";if(G.adminOK){G.editId=null;G.photo=undefined;G.view="edit";}else{G.after="new";G.view="admin";}}
 else if(a==="manage"){G.ok="";if(G.adminOK)G.view="manage";else{G.after="manage";G.view="admin";}}
 else if(a==="new"){G.ok="";G.editId=null;G.photo=undefined;G.view="edit";}
 else if(a==="edit"){G.ok="";G.editId=b.dataset.id;G.photo=undefined;G.view="edit";}
 else if(a==="manage-back"){G.ok="";G.view="manage";}
 else if(a==="done"){G.ok="";if(session&&ST(session)&&ST(session).hash){enterApp(session);return;}G.adminOK=false;G.view="profiles";}
 renderGate();
});

 if(id==="g-login")await doLogin();else if(id==="g-admin")await doAdmin();else if(id==="g-setup")await doSetup();else if(id==="g-edit")await doEdit();
});
$("gate").addEventListener("change",async e=>{
 if(e.target.id!=="g-file"||!e.target.files[0])return;
 try{G.photo=await readPhoto(e.target.files[0]);$("g-prev").innerHTML=pav(editTmp(),"md",G.photo);$("g-nophoto").hidden=false;}
 catch(err){showErr("Cette image ne peut pas être lue. Essayez une photo JPG ou PNG.");}
});

/* ---------- Verrouillage automatique ---------- */
const AKEY="passerelle-last-activity";
function lockMin(){return typeof state.lockMin==="number"?state.lockMin:5;}
let lastAct=Date.now(),lastStore=0;
function touch(force){lastAct=Date.now();if(force||lastAct-lastStore>10000){lastStore=lastAct;try{sessionStorage.setItem(AKEY,String(lastAct));}catch(e){}}}
function lockNow(reason){
 if(!session)return;
 const id=session;session=null;try{sessionStorage.removeItem(SKEY);}catch(e){}
 G.id=id;G.adminOK=false;G.msg="";G.ok="";G.note=reason||"Session verrouillée.";showGate("login");
}
function idleTooLong(since){const m=lockMin();return m>0&&Date.now()-since>m*60000;}
function checkIdle(){if(session&&$("gate").hidden&&idleTooLong(lastAct)){const m=lockMin();lockNow(`Session verrouillée après ${m} minute${m>1?"s":""} sans activité.`);}}
["pointerdown","keydown","wheel","touchstart","scroll"].forEach(ev=>window.addEventListener(ev,()=>{if(session)touch();},{passive:true,capture:true}));
setInterval(checkIdle,10000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkIdle();});
A.lock=()=>lockNow("Session verrouillée.");
A["cont-table"]=A["cont-log"]=d=>{ui.contTable=d.id;ui.contDate=TODAY;render();window.scrollTo(0,0);};
A["cont-back"]=()=>{ui.contTable=null;render();window.scrollTo(0,0);};
A["cont-surv"]=d=>survForm(d.id,pad(new Date().getHours()));
A["cs-new"]=d=>survForm(d.c,d.h);
A["cs-edit"]=d=>survForm(d.c,null,d.id);
A["cs-date"]=d=>{ui.contDate=d.n==="0"?TODAY:addDays(ui.contDate,+d.n);render();};
A["cont-params"]=()=>cpSettings();
A["cs-mode"]=d=>{ui.contMode=d.m;render();};
$("gate").addEventListener("change",e=>{
 if(e.target.id!=="g-lockmin")return;
 state.lockMin=+e.target.value;save();
 const p=$("gate").querySelector(".gate-ok");const msg=state.lockMin?`Verrouillage automatique réglé sur ${e.target.selectedOptions[0].textContent}.`:"Verrouillage automatique désactivé.";
 if(p)p.textContent=msg;else{G.ok=msg;renderGate();}
});

/* ---------- Démarrage ---------- */
const h0=location.hash.slice(1);
if(VIEW_FN[h0])ui.view=h0;
let storedAct=0;try{storedAct=+sessionStorage.getItem(AKEY)||0;}catch(e){}
if(!admins().length)showGate("setup");
else if(session&&ST(session)&&ST(session).hash){
 if(storedAct&&idleTooLong(storedAct)){const id=session;session=id;lockNow("Session verrouillée après une période d'inactivité.");}
 else enterApp(session);
}
else showGate("profiles");
})();
</script>
